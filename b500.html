function setP(pct, label) {

function sleep(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }
function san(str) {
  if (!str) return '';
  var s = String(str);
  var result = '';
  var map = {};
  map[String.fromCharCode(8212)] = '-';
  map[String.fromCharCode(8211)] = '-';
  map[String.fromCharCode(8216)] = "'";
  map[String.fromCharCode(8217)] = "'";
  map[String.fromCharCode(8220)] = '"';
  map[String.fromCharCode(8221)] = '"';
  map[String.fromCharCode(8230)] = '...';
  for (var i = 0; i < s.length; i++) {
    var ch = s[i];
    if (s.charCodeAt(i) > 127) {
      result += map[ch] !== undefined ? map[ch] : '';
    } else {
      result += ch;
    }
  }
  return result;
}
function replaceAll(str, find, repl) {
  var result = '';
  var idx = str.indexOf(find);
  while (idx !== -1) {
    result += str.slice(0, idx) + repl;
    str = str.slice(idx + find.length);
    idx = str.indexOf(find);
  }
  return result + str;
}
function splitParagraphs(str) {
  // Split on --- paragraph separators
  var parts = [], current = '', i = 0;
  while (i < str.length) {
    if (str[i] === '-' && str[i+1] === '-' && str[i+2] === '-') {
      if (current.trim()) parts.push(current.trim());
      current = '';
      i += 3;
      while (i < str.length && (str[i] === NL || str[i] === CR)) i++
    } else {
      current += str[i];
      i++;
    }
  }
  if (current.trim()) parts.push(current.trim());
  return parts;
}
function replaceNewlines(str) {
  return str.split(String.fromCharCode(10)).join('<br>');
}
function escapeQuotes(str) {
  return replaceAll(String(str), '"', '&quot;');

function fhub(path, retries) {
  retries = retries || 0;
  return fetch('https://finnhub.io/api/v1' + path + '&token=' + finKey)
    .then(function(r) {
      if (r.status === 429 && retries < 2) return sleep(5000).then(function(){ return fhub(path, retries+1); });
      if (!r.ok) throw new Error('Finnhub ' + r.status);
      return r.json();
    });
}

// ── TECHNICAL INDICATORS ───────────────────────

function calcSMA(arr, n) {
  if (!arr || arr.length < n) return null;
  var s = 0; for (var i = arr.length-n; i < arr.length; i++) s += arr[i];
  return s / n;
}
function calcEMA(arr, n) {
  if (!arr || arr.length < n) return null;
  var k = 2/(n+1), ema = 0;
  for (var i = 0; i < n; i++) ema += arr[i];
  ema /= n;
  for (var j = n; j < arr.length; j++) ema = arr[j]*k + ema*(1-k);
  return ema;
}
function calcRSI(arr, n) {
  if (!arr || arr.length < n+1) return null;
  var sl = arr.slice(-(n+1)), g = 0, l = 0;
  for (var i = 1; i < sl.length; i++) {
    var d = sl[i]-sl[i-1];
    if (d >= 0) g += d; else l -= d;
  }
  var ag = g/n, al = l/n;
  return al === 0 ? 100 : 100-(100/(1+ag/al));
}
function calcMACD(arr) {
  if (!arr || arr.length < 35) return null;
  var e12 = calcEMA(arr, 12), e26 = calcEMA(arr, 26);
  if (e12 == null || e26 == null) return null;
  var ml = e12-e26, ms = [];
  for (var i = arr.length-9; i < arr.length; i++) {
    var em12 = calcEMA(arr.slice(0,i+1),12), em26 = calcEMA(arr.slice(0,i+1),26);
    if (em12 != null && em26 != null) ms.push(em12-em26);
  }
  var sig = ms.length >= 3 ? ms.reduce(function(a,b){return a+b;},0)/ms.length : null;
  return {macd:ml, signal:sig, hist: sig!=null ? ml-sig : null};
}
function calcBoll(arr) {
  if (!arr || arr.length < 20) return null;
  var sl = arr.slice(-20), mean = sl.reduce(function(a,b){return a+b;},0)/20;
  var vr = sl.reduce(function(a,b){return a+Math.pow(b-mean,2);},0)/20;
  var sd = Math.sqrt(vr), up = mean+2*sd, lo = mean-2*sd;
  var pr = arr[arr.length-1];
  var pct = sd > 0 ? (pr-lo)/(up-lo)*100 : 50;
  return {upper:up, lower:lo, pct:pct};
}
function calcATR(h,l,c,n) {
  n = n||14;
  if (!h || h.length < n+1) return null;
  var trs = [];
  for (var i = 1; i < h.length; i++)
    trs.push(Math.max(h[i]-l[i], Math.abs(h[i]-c[i-1]), Math.abs(l[i]-c[i-1])));
  var sl = trs.slice(-n);
  return sl.reduce(function(a,b){return a+b;},0)/n;
}
function techSignal(sma20, sma50, rsi, price, macd, boll) {
  if (!sma20||!sma50||!rsi||!price) return 'N/A';
  var sc = 0;
  if (price>sma20) sc++; if (price>sma50) sc++; if (sma20>sma50) sc++;
  if (rsi>50) sc++; if (rsi<30) sc--; if (rsi>75) sc--;
  if (macd && macd.hist != null) { if (macd.hist>0) sc++; else sc--; }
  if (boll && boll.pct != null) { if (boll.pct>80) sc--; if (boll.pct<20) sc++; }
  if (sc>=5) return 'STRONG BUY';
  if (sc>=3) return 'BUY';
  if (sc<=-1) return 'SELL';
  if (sc<=1) return 'WEAK';
  return 'HOLD';
}

function startBrief() {
  antKey = document.getElementById('ant-key').value.trim();
  finKey = document.getElementById('fin-key').value.trim();
  qMode  = document.getElementById('mode-sel').value === 'quick';

  var err = document.getElementById('errmsg');
  if (!antKey || antKey.indexOf('sk-ant') !== 0) {
    err.textContent = 'Please enter a valid Anthropic API key (starts with sk-ant-).';
    err.style.display = 'block'; return;
  }
  if (!finKey) {
    err.textContent = 'Please enter your Finnhub API key.';
    err.style.display = 'block'; return;
  }
  err.style.display = 'none';
  saveKeys();

  document.getElementById('overlay').style.display  = 'none';
  document.getElementById('progress').style.display = 'block';
  setP(2, 'Fetching quotes...');

  var holdings = qMode
    ? ALL_HOLDINGS.filter(function(h){ return h.th==='Benchmark'; })
        .concat(ALL_HOLDINGS.filter(function(h){ return h.th!=='Benchmark'; }).slice(0,15))
    : ALL_HOLDINGS;

  var qdata = [], fails = [];

  // Batch quote fetch
  function fetchBatch(batch) {
    return Promise.allSettled(
      batch.map(function(h){ return fhub('/quote?symbol='+h.t); })
    ).then(function(results) {
      results.forEach(function(res, i) {
        var h = batch[i];
        if (res.status === 'fulfilled') {
          var q = res.value;
          qdata.push({t:h.t,th:h.th,price:q.c||null,change:q.d||null,pct:q.dp||null,high:q.h||null,low:q.l||null});
        } else {
          fails.push(h.t);
          qdata.push({t:h.t,th:h.th,price:null,change:null,pct:null,high:null,low:null});
        }
      });
    });
  }

  var batchSize = 5;
  var p = Promise.resolve();
  for (var bi = 0; bi < holdings.length; bi += batchSize) {
    (function(batch, idx) {
      p = p.then(function() {
        setP(2+Math.round(idx/holdings.length*20), 'Quotes batch '+(Math.floor(idx/batchSize)+1));
        return fetchBatch(batch);
      }).then(function() {
        if (idx + batchSize < holdings.length) return sleep(6000);
      });
    })(holdings.slice(bi, bi+batchSize), bi);
  }

  p.then(function() { return runRest(); }).catch(function(e) {
    document.getElementById('progress').style.display = 'none';
    document.getElementById('report').style.display = 'block';
    document.getElementById('report').innerHTML = '<div class="warn">Error: '+e.message+'</div>';
  });
}

function runRest() {
  var rangeMap = {}, targetMap = {}, techMap = {}, epsMap = {}, newsDigest = [], analystMap = {}, earningsMap = {};
  var nonBench = ALL_HOLDINGS.filter(function(h){ return h.th!=='Benchmark'&&h.th!=='ETF'; });

  setP(24, 'Fetching 52-week ranges...');

  // Sequential fetches
  var seq = Promise.resolve();

  // 52w ranges + price targets
  nonBench.forEach(function(h) {
    seq = seq.then(function() {
      return fhub('/stock/metric?symbol='+h.t+'&metric=all').then(function(r) {
        var m = r.metric||{};
        rangeMap[h.t] = {hi52:m['52WeekHigh']||null, lo52:m['52WeekLow']||null};
      }).catch(function(){});
    }).then(function() { return sleep(1500); })
    .then(function() {
      return fhub('/stock/price-target?symbol='+h.t).then(function(r) {
        if (r && r.targetMean) targetMap[h.t] = {mean:r.targetMean};
      }).catch(function(){});
    }).then(function() { return sleep(1500); });
  });

  // Candle data - top 10 by value
  seq = seq.then(function() {
    setP(44, 'Computing portfolio weights...');
    var sh = loadShares();
    var ranked = qdata
      .filter(function(q){ return q.th!=='Benchmark'&&q.th!=='ETF'&&q.price!=null; })
      .map(function(q){ return {t:q.t, val:(sh[q.t]||0)*(q.price||0)}; })
      .sort(function(a,b){ return b.val-a.val; });
    var techTks = ranked.filter(function(x){ return x.val>0; }).slice(0,10).map(function(x){ return x.t; });
    if (techTks.length < 3) {
      techTks = qdata.filter(function(q){ return q.th!=='Benchmark'&&q.th!=='ETF'&&q.price!=null; })
        .sort(function(a,b){ return Math.abs(b.pct||0)-Math.abs(a.pct||0); })
        .slice(0,10).map(function(q){ return q.t; });
    }
    var allTechTks = ['SPY'].concat(techTks);
    var toTs = Math.floor(Date.now()/1000), fromTs = toTs - 200*24*3600;
    var tp = Promise.resolve();
    allTechTks.forEach(function(tk, i) {
      tp = tp.then(function() {
        setP(44+Math.round(i/allTechTks.length*14), 'Technical '+(i+1)+'/'+allTechTks.length+': '+tk);
        return fhub('/stock/candle?symbol='+tk+'&resolution=D&from='+fromTs+'&to='+toTs).then(function(c) {
          if (c && c.s==='ok' && c.c && c.c.length>20) {
            var cl=c.c,hi=c.h,lo=c.l,vo=c.v,pr=cl[cl.length-1];
            var sma20=calcSMA(cl,20), sma50=calcSMA(cl,Math.min(50,cl.length-1));
            var rsi=calcRSI(cl,14), macd=calcMACD(cl), boll=calcBoll(cl);
            var atr=calcATR(hi,lo,cl,14);
            var sig=techSignal(sma20,sma50,rsi,pr,macd,boll);
            var trend='Neutral';
            if (sma20&&sma50) {
              if (pr>sma20&&sma20>sma50) trend='Uptrend';
              else if (pr<sma20&&sma20<sma50) trend='Downtrend';
              else if (pr>sma50) trend='Above 50d';
              else trend='Below 50d';
            }
            var r30=cl.length>=31?(cl[cl.length-1]-cl[cl.length-31])/cl[cl.length-31]*100:null;
            var r90=cl.length>=91?(cl[cl.length-1]-cl[cl.length-91])/cl[cl.length-91]*100:null;
            var vr=vo&&vo.length>=20?vo[vo.length-1]/(vo.slice(-20).reduce(function(a,b){return a+b;},0)/20):null;
            techMap[tk]={sma20:sma20,sma50:sma50,rsi:rsi,macd:macd,boll:boll,atr:atr,sig:sig,trend:trend,r30:r30,r90:r90,vr:vr};
          }
        }).catch(function(){});
      }).then(function(){ return sleep(1500); });
    });
    return tp;
  });

  // RS vs SPY
  seq = seq.then(function() {
    var spy = techMap['SPY'];
    Object.keys(techMap).forEach(function(tk) {
      if (tk==='SPY') return;
      var v = techMap[tk];
      v.a30 = (v.r30!=null&&spy&&spy.r30!=null) ? v.r30-spy.r30 : null;
      v.a90 = (v.r90!=null&&spy&&spy.r90!=null) ? v.r90-spy.r90 : null;
    });
  });

  // EPS
  seq = seq.then(function() {
    setP(60, 'Fetching earnings data...');
    var epsTks = Object.keys(techMap).filter(function(t){ return t!=='SPY'; }).slice(0,8);
    var ep = Promise.resolve();
    epsTks.forEach(function(tk) {
      ep = ep.then(function() {
        return fhub('/stock/earnings?symbol='+tk+'&limit=1').then(function(e) {
          if (e&&e.length>0) epsMap[tk]={date:e[0].period,actual:e[0].actual,est:e[0].estimate,surpPct:e[0].surprisePercent};
        }).catch(function(){});
      }).then(function(){ return sleep(1500); });
    });
    return ep;
  });

  // Earnings calendar
  seq = seq.then(function() {
    setP(65, 'Fetching earnings calendar...');
    var from = new Date().toISOString().slice(0,10);
    var to   = new Date(Date.now()+90*24*3600*1000).toISOString().slice(0,10);
    return fhub('/calendar/earnings?from='+from+'&to='+to).then(function(ec) {
      (ec.earningsCalendar||[]).forEach(function(e) {
        if (ALL_HOLDINGS.some(function(h){ return h.t===e.symbol; })) earningsMap[e.symbol]=e.date;
      });
    }).catch(function(){});
  }).then(function(){ return sleep(1500); });

  // News
  seq = seq.then(function() {
    setP(68, 'Fetching news...');
    var valid = qdata.filter(function(q){ return q.pct!=null; });
    valid.sort(function(a,b){ return Math.abs(b.pct||0)-Math.abs(a.pct||0); });
    var newsTks = valid.slice(0,10).map(function(q){ return q.t; });
    var np = Promise.resolve();
    newsTks.forEach(function(tk) {
      np = np.then(function() {
        var today = new Date().toISOString().slice(0,10);
        var yest  = new Date(Date.now()-2*86400000).toISOString().slice(0,10);
        return fhub('/company-news?symbol='+tk+'&from='+yest+'&to='+today).then(function(n) {
          if (n&&n.length>0) newsDigest.push({t:tk,hl:san(n[0].headline),src:san(n[0].source)});
        }).catch(function(){});
      }).then(function(){ return sleep(1500); });
    });
    return np;
  });

  // Analyst
  seq = seq.then(function() {
    setP(76, 'Fetching analyst ratings...');
    var aTks = Object.keys(techMap).filter(function(t){ return t!=='SPY'; }).slice(0,8);
    var ap = Promise.resolve();
    aTks.forEach(function(tk) {
      ap = ap.then(function() {
        return fhub('/stock/recommendation?symbol='+tk).then(function(r) {
          if (r&&r.length>0) analystMap[tk]={buy:r[0].strongBuy+r[0].buy,hold:r[0].hold,sell:r[0].sell+r[0].strongSell};
        }).catch(function(){});
      }).then(function(){ return sleep(1500); });
    });
    return ap;

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Portfolio Brief</title>
<style>
:root{--ink:#1a1a2e;--panel:#16213e;--dim:#8892b0;--text:#ccd6f6;--green:#64ffda;--red:#ff6b6b;--yellow:#ffd166;--white:#e6f1ff;--border:rgba(100,255,218,0.15);--accent:#533483;--gold:#e94560;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--ink);color:var(--text);font-family:'Segoe UI',sans-serif;font-size:14px;line-height:1.6;}
#overlay{position:fixed;inset:0;background:rgba(10,10,20,0.93);display:flex;align-items:center;justify-content:center;z-index:1000;}
#box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:2.5rem 3rem;width:440px;max-width:95vw;}
#box h1{font-size:1.3rem;color:var(--white);margin-bottom:0.3rem;}
#box p{color:var(--dim);font-size:0.85rem;margin-bottom:1.4rem;}
.fl{margin-bottom:1rem;}
.fl label{display:block;font-size:0.72rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);margin-bottom:0.35rem;}
.fl input,.fl select{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:6px;color:var(--white);padding:0.6rem 0.85rem;font-size:0.88rem;}
.fl input:focus,.fl select:focus{outline:none;border-color:var(--green);}
.fl select option{background:var(--panel);}
.saved{font-size:0.7rem;color:var(--green);margin-left:0.5rem;display:none;}
#genbtn{width:100%;background:linear-gradient(135deg,var(--accent),var(--gold));color:#fff;border:none;border-radius:6px;padding:0.8rem;font-size:0.95rem;font-weight:600;cursor:pointer;margin-top:0.5rem;}
#genbtn:hover{opacity:0.9;}
#errmsg{color:var(--red);font-size:0.82rem;margin-top:0.7rem;display:none;}
#clearbtn{background:none;border:none;color:var(--dim);font-size:0.75rem;cursor:pointer;text-decoration:underline;margin-top:0.5rem;display:block;}
#manage-holdings-btn{width:100%;background:none;border:1px solid var(--border);color:var(--green);border-radius:6px;padding:0.6rem;font-size:0.82rem;cursor:pointer;margin-top:0.8rem;}
#progress{display:none;padding:3rem 2rem;text-align:center;}
.pb-wrap{background:rgba(255,255,255,0.08);border-radius:99px;height:6px;width:320px;margin:1.2rem auto 0.8rem;overflow:hidden;}
.pb-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:99px;transition:width 0.4s;width:0%;}
#plabel{color:var(--dim);font-size:0.85rem;}
#report{display:none;max-width:1100px;margin:0 auto;padding:1.5rem 1.5rem 4rem;}
.rhead{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border);margin-bottom:1.5rem;}
.rhead h2{font-size:1.4rem;font-weight:700;color:var(--white);}
.rdate{color:var(--dim);font-size:0.82rem;}
.rbtn{background:transparent;border:1px solid var(--border);color:var(--green);border-radius:6px;padding:0.4rem 1rem;font-size:0.82rem;cursor:pointer;}
.scorecard{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0.9rem;margin-bottom:1.5rem;}
.sc{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:1rem 1.2rem;}
.sc-label{font-size:0.7rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);margin-bottom:0.4rem;}
.sc-val{font-size:1.5rem;font-weight:700;color:var(--white);line-height:1;}
.sc-sub{font-size:0.75rem;color:var(--dim);margin-top:0.25rem;}
.section{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:1.2rem 1.4rem;margin-bottom:1.2rem;}
.section h3{font-size:0.72rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--green);margin-bottom:1rem;}
.up{color:var(--green);} .dn{color:var(--red);} .na{color:var(--dim);}
.htable{width:100%;border-collapse:collapse;font-size:0.82rem;}
.htable th{text-align:left;padding:0 0.6rem 0.6rem;font-size:0.67rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border);}
.htable th.r,.htable td.r{text-align:right;}
.htable td{padding:0.45rem 0.6rem;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle;}
.htable tr:last-child td{border-bottom:none;}
.htable tr:hover td{background:rgba(255,255,255,0.03);}
.tk{font-weight:700;font-family:monospace;color:var(--white);}
.badge{display:inline-block;font-size:0.65rem;padding:0.15rem 0.5rem;border-radius:99px;background:rgba(83,52,131,0.5);border:1px solid rgba(83,52,131,0.8);color:#c9b8ff;white-space:nowrap;}
.sig-buy{color:var(--green);font-weight:700;font-size:0.75rem;}
.sig-sell{color:var(--red);font-weight:700;font-size:0.75rem;}
.sig-hold{color:var(--yellow);font-weight:700;font-size:0.75rem;}
.sh-in{width:72px;background:rgba(255,255,255,0.04);border:1px solid transparent;border-radius:4px;color:var(--dim);font-size:0.78rem;padding:0.18rem 0.4rem;text-align:right;font-family:monospace;}
.sh-in:focus{outline:none;border-color:rgba(100,255,218,0.4);color:var(--green);}
.note-in{width:100%;background:rgba(255,255,255,0.04);border:1px solid transparent;border-radius:4px;color:var(--dim);font-size:0.75rem;padding:0.2rem 0.4rem;font-family:inherit;resize:none;height:24px;}
.note-in:focus{outline:none;border-color:rgba(255,214,102,0.4);color:var(--yellow);}
.srow{display:flex;align-items:center;gap:0.8rem;margin-bottom:0.55rem;font-size:0.82rem;}
.slabel{min-width:140px;color:var(--dim);}
.sbar-wrap{flex:1;height:8px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden;}
.sbar-fill{height:100%;border-radius:99px;}
.spct{min-width:52px;text-align:right;font-family:monospace;}
.rbar-wrap{width:70px;height:6px;background:rgba(255,255,255,0.1);border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle;}
.rbar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:99px;}
.abar{display:flex;align-items:center;gap:0.7rem;background:rgba(233,69,96,0.1);border:1px solid rgba(233,69,96,0.3);border-radius:8px;padding:0.65rem 1rem;margin-bottom:0.45rem;font-size:0.85rem;}
.abar-tk{font-weight:700;font-family:monospace;color:var(--yellow);min-width:62px;}
.abar-r{color:var(--text);flex:1;}
.abar-p{font-weight:700;font-family:monospace;}
.ni{display:flex;gap:0.8rem;padding:0.6rem 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.ni:last-child{border-bottom:none;}
.ni-tk{font-weight:700;font-family:monospace;color:var(--yellow);min-width:62px;font-size:0.8rem;}
.ni-hl{font-size:0.85rem;color:var(--text);}
.ni-src{font-size:0.72rem;color:var(--dim);}
.ep-row{display:flex;align-items:baseline;gap:0.7rem;padding:0.5rem 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:0.82rem;flex-wrap:wrap;}
.ep-row:last-child{border-bottom:none;}
.ep-tk{font-weight:700;font-family:monospace;color:var(--white);min-width:62px;}
.ep-beat{color:var(--green);font-size:0.78rem;} .ep-miss{color:var(--red);font-size:0.78rem;} .ep-dim{color:var(--dim);font-size:0.78rem;}
.wl-add{display:flex;gap:0.6rem;margin-bottom:1rem;}
.wl-add input{flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:6px;color:var(--white);padding:0.5rem 0.8rem;font-size:0.88rem;font-family:monospace;}
.wl-add input:focus{outline:none;border-color:var(--green);}
.wl-add button{background:rgba(100,255,218,0.1);border:1px solid var(--green);color:var(--green);border-radius:6px;padding:0.5rem 1rem;font-size:0.85rem;cursor:pointer;font-weight:600;}
.wl-row{display:flex;align-items:center;gap:0.5rem;padding:0.45rem 0.6rem;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.82rem;flex-wrap:wrap;}
.wl-row:last-child{border-bottom:none;}
.wl-rm{background:none;border:none;color:var(--dim);cursor:pointer;font-size:1rem;padding:0 0.2rem;}
.wl-rm:hover{color:var(--red);}
.warn{background:rgba(255,214,102,0.07);border:1px solid rgba(255,214,102,0.3);border-radius:8px;padding:0.8rem 1rem;font-size:0.82rem;margin-bottom:1rem;color:var(--yellow);}
#brief-stream{font-size:0.92rem;line-height:1.85;color:var(--text);}
#brief-stream p{margin-bottom:1.1em;}
#brief-stream hr{border:none;border-top:1px solid var(--border);margin:1.1em 0;}
.cursor{display:inline-block;width:2px;height:1em;background:var(--green);animation:blink 1s steps(1) infinite;vertical-align:text-bottom;}
@keyframes blink{50%{opacity:0;}}
.arch-entry{border-bottom:1px solid var(--border);padding:0.8rem 0;}
.arch-entry:last-child{border-bottom:none;}
.arch-date{font-size:0.75rem;color:var(--dim);font-family:monospace;margin-bottom:0.3rem;}
.arch-prev{font-size:0.83rem;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.arch-btn{background:transparent;border:none;color:var(--green);font-size:0.75rem;cursor:pointer;padding:0.2rem 0;display:block;}
.arch-full{display:none;font-size:0.83rem;color:var(--text);margin-top:0.4rem;}
#hmodal-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,20,0.88);z-index:2000;align-items:center;justify-content:center;}
#hmodal-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:1.8rem 2rem;width:560px;max-width:95vw;max-height:85vh;overflow-y:auto;}
#hmodal-box h2{color:var(--white);font-size:1.15rem;margin-bottom:0.3rem;}
#hmodal-box>p{color:var(--dim);font-size:0.8rem;margin-bottom:1rem;}
.hm-add-row{display:flex;gap:0.5rem;margin-bottom:0.4rem;}
.hm-add-row input{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:6px;color:var(--white);padding:0.5rem 0.7rem;font-size:0.85rem;}
#hm-ticker{width:90px;font-family:monospace;text-transform:uppercase;}
#hm-theme{flex:1;}
#hm-add-btn{background:rgba(100,255,218,0.1);border:1px solid var(--green);color:var(--green);border-radius:6px;padding:0.5rem 1rem;font-size:0.85rem;cursor:pointer;font-weight:600;white-space:nowrap;}
#hm-err{color:var(--red);font-size:0.78rem;display:none;margin-bottom:0.5rem;}
#hm-note{color:var(--yellow);font-size:0.78rem;display:none;margin-bottom:0.5rem;}
#hm-list{max-height:340px;overflow-y:auto;border-top:1px solid var(--border);margin-top:0.6rem;}
.hm-row{display:flex;align-items:center;gap:0.6rem;padding:0.45rem 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:0.82rem;}
.hm-row-tk{font-family:monospace;font-weight:700;min-width:60px;color:var(--white);}
.hm-row-sh{color:var(--dim);flex:1;text-align:right;font-family:monospace;font-size:0.78rem;}
.hm-rm{background:none;border:none;color:var(--dim);cursor:pointer;font-size:1rem;padding:0 0.2rem;}
.hm-rm:hover{color:var(--red);}
#hm-close-btn{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:0.5rem 1.1rem;font-size:0.82rem;cursor:pointer;}

/* Heat Map */
.hmap-wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;}
.hmap-cell{display:flex;align-items:center;justify-content:center;border-radius:6px;font-family:monospace;font-weight:700;color:#fff;font-size:0.7rem;cursor:default;transition:transform 0.15s;position:relative;overflow:hidden;flex-direction:column;gap:2px;}
.hmap-cell:hover{transform:scale(1.06);z-index:10;}
.hmap-tk{font-size:0.72rem;font-weight:800;}
.hmap-pct{font-size:0.65rem;opacity:0.9;}
/* Sort buttons */
.sort-bar{display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:0.8rem;}
.sort-btn{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--dim);border-radius:4px;padding:0.25rem 0.6rem;font-size:0.72rem;cursor:pointer;}
.sort-btn.active{background:rgba(100,255,218,0.1);border-color:var(--green);color:var(--green);}
/* Opportunity ranking */
.opp-bar-wrap{flex:1;height:6px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle;min-width:60px;}
.opp-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:99px;}
/* Decision brief toggle */
.mode-tag{display:inline-block;font-size:0.65rem;padding:0.1rem 0.4rem;border-radius:4px;background:rgba(83,52,131,0.6);color:#c9b8ff;margin-left:0.4rem;vertical-align:middle;}
/* What Changed */
.chg-row{display:flex;gap:0.5rem;align-items:baseline;padding:0.35rem 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.8rem;flex-wrap:wrap;}
.chg-row:last-child{border-bottom:none;}
.chg-tk{font-family:monospace;font-weight:700;min-width:62px;color:var(--white);}
.chg-item{color:var(--dim);font-size:0.75rem;}
.chg-up{color:var(--green);} .chg-dn{color:var(--red);}

@media print{#overlay,#progress,.rbtn{display:none!important;}body{background:#fff;color:#000;}.section{border:1px solid #ddd;background:#fff;}#report{display:block!important;}}
@media(max-width:640px){.scorecard{grid-template-columns:repeat(2,1fr);}.hm{display:none;}#report{padding:1rem 0.75rem 3rem;}}
</style>
</head>
<body>
<div id="overlay">
  <div id="box">
    <h1>Portfolio Close-of-Market Brief</h1>
    <p>Keys save automatically after first use.</p>
    <div class="fl"><label>Anthropic API Key <span class="saved" id="ant-saved">saved</span></label><input type="password" id="ant-key" placeholder="sk-ant-..." autocomplete="off"></div>
    <div class="fl"><label>Finnhub API Key <span class="saved" id="fin-saved">saved</span></label><input type="password" id="fin-key" placeholder="finnhub key" autocomplete="off"></div>
    <div class="fl"><label>FMP API Key <span class="saved" id="fmp-saved">saved</span></label><input type="password" id="fmp-key" placeholder="financialmodelingprep key" autocomplete="off"></div>
    <div class="fl"><label>Mode</label><select id="mode-sel"><option value="full">Full Brief</option><option value="quick">Quick Brief</option><option value="decision">Decision Brief</option></select></div>
    <div id="errmsg"></div>
    <button id="genbtn">Generate Brief</button>
    <button id="manage-holdings-btn" onclick="window.openHoldingsManager()">Manage Holdings</button>
    <button id="clearbtn">Clear saved keys</button>
  </div>
</div>
<div id="progress">
  <div style="color:var(--white);font-size:1rem;font-weight:600;">Building your brief...</div>
  <div class="pb-wrap"><div class="pb-fill" id="pbfill"></div></div>
  <div id="plabel">Initialising...</div>
</div>
<div id="report"></div>

<div id="hmodal-overlay">
  <div id="hmodal-box">
    <h2>Manage Holdings</h2>
    <p>Add new positions or remove holdings you've sold. Changes are saved immediately and included in Export/Import.</p>
    <div class="hm-add-row">
      <input id="hm-ticker" placeholder="Ticker">
      <input id="hm-theme" placeholder="Theme (e.g. Financials)" list="hm-theme-list">
      <datalist id="hm-theme-list"></datalist>
      <button id="hm-add-btn">+ Add</button>
    </div>
    <div id="hm-err"></div>
    <div id="hm-note"></div>
    <div id="hm-list"></div>
    <div style="display:flex;justify-content:flex-end;gap:0.5rem;margin-top:1.1rem;">
      <button id="hm-close-btn">Done</button>
    </div>
  </div>
</div>

<script>
(function() {
"use strict";

var DEFAULT_HOLDINGS = [
  {t:'AAPL',th:'Big Tech'},{t:'AMZN',th:'Big Tech'},{t:'ASML',th:'Semis'},
  {t:'AVGO',th:'Semis'},{t:'BA',th:'Industrial'},{t:'BABA',th:'China Tech'},
  {t:'BAC',th:'Financials'},{t:'BEP',th:'Clean Energy'},{t:'BEPC',th:'Clean Energy'},
  {t:'BMY',th:'Healthcare'},{t:'CAT',th:'Industrial'},{t:'COP',th:'Energy'},
  {t:'COWZ',th:'ETF'},{t:'CRWD',th:'Cybersecurity'},{t:'CSCO',th:'Big Tech'},
  {t:'CVX',th:'Energy'},{t:'DAL',th:'Transport'},{t:'DASH',th:'Consumer Tech'},
  {t:'DELL',th:'Big Tech'},{t:'FDFX',th:'Transport'},{t:'FDX',th:'Transport'},
  {t:'GE',th:'Industrial'},{t:'GEHC',th:'Healthcare'},{t:'GEV',th:'Industrial'},
  {t:'GM',th:'Autos'},{t:'HD',th:'Consumer'},{t:'IBIT',th:'Crypto'},
  {t:'INTC',th:'Semis'},{t:'JNJ',th:'Healthcare'},{t:'JPM',th:'Financials'},
  {t:'LLY',th:'Healthcare'},{t:'MOG.A',th:'Industrial'},{t:'MSFT',th:'Big Tech'},
  {t:'NKE',th:'Consumer'},{t:'NVDA',th:'Semis'},{t:'NYT',th:'Media'},
  {t:'PFE',th:'Healthcare'},{t:'PKX',th:'Materials'},{t:'QCOM',th:'Semis'},
  {t:'SBGSY',th:'Industrial'},{t:'SO',th:'Utilities'},{t:'SPGI',th:'Financials'},
  {t:'TSM',th:'Semis'},{t:'V',th:'Financials'},{t:'VEEV',th:'Healthcare'},
  {t:'VRTX',th:'Healthcare'},{t:'VTRS',th:'Healthcare'},{t:'WAB',th:'Industrial'},
  {t:'WMT',th:'Consumer'},{t:'XOM',th:'Energy'},{t:'SPY',th:'Benchmark'},{t:'QQQ',th:'Benchmark'}
];
var HOLDINGS = DEFAULT_HOLDINGS.slice();
var DEFAULT_WL = ['NET','FIX','NFLX','COST','BLK','UNH','ABT','NEE','ATZAF','MA'];
var KEYS_K='hf_api_keys', SH_K='hf_shares', NT_K='hf_notes', AR_K='hf_archive', WL_K='hf_wl', WLN_K='hf_wln', HOLD_K='hf_holdings';

function sg(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function loadKeys(){var s=sg(KEYS_K);if(s&&s.a){document.getElementById('ant-key').value=s.a;document.getElementById('ant-saved').style.display='inline';}if(s&&s.f){document.getElementById('fin-key').value=s.f;document.getElementById('fin-saved').style.display='inline';}if(s&&s.m){document.getElementById('fmp-key').value=s.m;document.getElementById('fmp-saved').style.display='inline';}}
function saveKeys(a,f,m){ss(KEYS_K,{a:a,f:f,m:m});}
function clearKeys(){ss(KEYS_K,null);document.getElementById('ant-key').value='';document.getElementById('fin-key').value='';document.getElementById('fmp-key').value='';document.getElementById('ant-saved').style.display='none';document.getElementById('fin-saved').style.display='none';document.getElementById('fmp-saved').style.display='none';}
function loadSh(){return sg(SH_K)||{};}
function saveSh(t,v){var s=loadSh();var n=parseFloat(v);if(!isNaN(n)&&n>0)s[t]=n;else delete s[t];ss(SH_K,s);}
function loadNt(){return sg(NT_K)||{};}
function saveNt(t,v){var n=loadNt();if(v&&v.trim())n[t]=v.trim();else delete n[t];ss(NT_K,n);}
function loadWL(){var w=sg(WL_K);return(w&&w.length)?w:DEFAULT_WL.slice();}
function saveWL(l){ss(WL_K,l);}
function loadWLN(){return sg(WLN_K)||{};}
function saveWLN(t,v){var n=loadWLN();if(v&&v.trim())n[t]=v.trim();else delete n[t];ss(WLN_K,n);}
function loadArch(){return sg(AR_K)||[];}
function saveArch(e){var l=loadArch();l.unshift(e);if(l.length>30)l.length=30;ss(AR_K,l);}
function loadHoldings(){
  var h=sg(HOLD_K);
  if(h&&h.length){
    // Ensure V is present even in old saved lists
    if(!h.some(function(x){return x.t==='V';})){
      h.push({t:'V',th:'Financials'});
      ss(HOLD_K,h);
    }
    return h;
  }
  return DEFAULT_HOLDINGS.slice();
}
function saveHoldings(l){ss(HOLD_K,l);}

function setP(pct,lbl){document.getElementById('pbfill').style.width=pct+'%';document.getElementById('plabel').textContent=lbl;}
function slp(ms){return new Promise(function(r){setTimeout(r,ms);});}
function san(s){if(!s)return'';var r='',i,c,cd;for(i=0;i<s.length;i++){c=s[i];cd=s.charCodeAt(i);if(cd<=127){r+=c;}else if(cd===8212||cd===8211){r+='-';}else if(cd===8216||cd===8217){r+="'";}else if(cd===8220||cd===8221){r+='"';}else if(cd===8230){r+='...';}}return r;}
function fP(n){return n!=null?'$'+n.toFixed(2):'<span class="na">n/a</span>';}
function fPct(n){if(n==null)return'<span class="na">n/a</span>';return'<span class="'+(n>=0?'up':'dn')+'">'+(n>=0?'+':'')+n.toFixed(2)+'%</span>';}
function fChg(n){if(n==null)return'<span class="na">n/a</span>';return'<span class="'+(n>=0?'up':'dn')+'">'+(n>=0?'+':'-')+'$'+Math.abs(n).toFixed(2)+'</span>';}

var antKey='', finKey='', fmpKey='', qMode=false;
function fmp(path){
  var base='https://financialmodelingprep.com/stable';
  var sep=path.indexOf('?')>=0?'&':'?';
  var url=base+path+sep+'apikey='+fmpKey;
  return fetch(url)
    .then(function(r){if(!r.ok)throw new Error('FMP '+r.status);return r.json();})
    .catch(function(e){console.warn('FMP error:',e.message,'path:',path);throw e;});
}

function fhub(path,retries){
  retries=retries||0;
  return fetch('https://finnhub.io/api/v1'+path+'&token='+finKey)
    .then(function(r){
      if(r.status===429&&retries<2)return slp(5000).then(function(){return fhub(path,retries+1);});
      if(r.status===401)throw new Error('Finnhub 401: invalid API key');
      if(r.status===403)throw new Error('Finnhub 403: key lacks permission for this endpoint');
      if(!r.ok)throw new Error('Finnhub '+r.status+' on '+path);
      return r.json();
    });
}

function fmpOk(path){
  // Same as fmp() but never throws — returns null on any error
  var base='https://financialmodelingprep.com/stable';
  var sep=path.indexOf('?')>=0?'&':'?';
  var url=base+path+sep+'apikey='+fmpKey;
  return fetch(url)
    .then(function(r){
      if(r.status===401||r.status===403){console.warn('FMP auth error on '+path);return null;}
      if(!r.ok){console.warn('FMP '+r.status+' on '+path);return null;}
      return r.json();
    })
    .catch(function(e){console.warn('FMP fetch failed:',e.message,path);return null;});
}

function calcSMA(a,n){if(!a||a.length<n)return null;var s=0,i;for(i=a.length-n;i<a.length;i++)s+=a[i];return s/n;}
function calcEMA(a,n){if(!a||a.length<n)return null;var k=2/(n+1),e=0,i,j;for(i=0;i<n;i++)e+=a[i];e/=n;for(j=n;j<a.length;j++)e=a[j]*k+e*(1-k);return e;}
function calcRSI(a,n){if(!a||a.length<n+1)return null;var sl=a.slice(-(n+1)),g=0,l=0,i,d;for(i=1;i<sl.length;i++){d=sl[i]-sl[i-1];if(d>=0)g+=d;else l-=d;}var ag=g/n,al=l/n;return al===0?100:100-(100/(1+ag/al));}
function calcMACD(a){if(!a||a.length<35)return null;var e12=calcEMA(a,12),e26=calcEMA(a,26);if(e12==null||e26==null)return null;var ml=e12-e26,ms=[],i,em12,em26,sig;for(i=a.length-9;i<a.length;i++){em12=calcEMA(a.slice(0,i+1),12);em26=calcEMA(a.slice(0,i+1),26);if(em12!=null&&em26!=null)ms.push(em12-em26);}sig=ms.length>=3?ms.reduce(function(x,y){return x+y;},0)/ms.length:null;return{macd:ml,signal:sig,hist:sig!=null?ml-sig:null};}
function calcBoll(a){if(!a||a.length<20)return null;var sl=a.slice(-20),mean=sl.reduce(function(x,y){return x+y;},0)/20,vr=sl.reduce(function(x,y){return x+Math.pow(y-mean,2);},0)/20,sd=Math.sqrt(vr),up=mean+2*sd,lo=mean-2*sd,pr=a[a.length-1],pct=sd>0?(pr-lo)/(up-lo)*100:50;return{upper:up,lower:lo,pct:pct};}
function calcATR(h,l,c,n){n=n||14;if(!h||h.length<n+1)return null;var trs=[],i;for(i=1;i<h.length;i++)trs.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));var sl=trs.slice(-n);return sl.reduce(function(a,b){return a+b;},0)/n;}
function calcFib(highs,lows,closes){
  if(!highs||highs.length<20)return null;
  var recent=Math.min(highs.length,60);
  var rh=highs.slice(-recent),rl=lows.slice(-recent);
  var swingHigh=rh.reduce(function(a,b){return a>b?a:b;},rh[0]);
  var swingLow=rl.reduce(function(a,b){return a<b?a:b;},rl[0]);
  var diff=swingHigh-swingLow;
  if(diff<=0)return null;
  var price=closes[closes.length-1];
  var levels={r236:swingLow+diff*0.236,r382:swingLow+diff*0.382,r500:swingLow+diff*0.500,r618:swingLow+diff*0.618,r786:swingLow+diff*0.786,high:swingHigh,low:swingLow};
  var nearest=null,nearestDist=Infinity,nearestName='';
  var names=['r236','r382','r500','r618','r786','high','low'];
  var labels=['23.6%','38.2%','50%','61.8%','78.6%','High','Low'];
  for(var i=0;i<names.length;i++){var dist=Math.abs(price-levels[names[i]]);if(dist<nearestDist){nearestDist=dist;nearest=levels[names[i]];nearestName=labels[i];}}
  var nearPct=nearest?(price-nearest)/nearest*100:null;
  return{levels:levels,nearest:nearest,nearestName:nearestName,nearPct:nearPct,swingHigh:swingHigh,swingLow:swingLow};
}
function techSig(s20,s50,rsi,pr,macd,boll){if(!s20||!s50||!rsi||!pr)return'N/A';var sc=0;if(pr>s20)sc++;if(pr>s50)sc++;if(s20>s50)sc++;if(rsi>50)sc++;if(rsi<30)sc--;if(rsi>75)sc--;if(macd&&macd.hist!=null){if(macd.hist>0)sc++;else sc--;}if(boll&&boll.pct!=null){if(boll.pct>80)sc--;if(boll.pct<20)sc++;}if(sc>=5)return'STRONG BUY';if(sc>=3)return'BUY';if(sc<=-1)return'SELL';if(sc<=1)return'WEAK';return'HOLD';}

function main(){
  HOLDINGS = loadHoldings();
  var qdata=[], fails=[];
  var rangeMap={}, targetMap={}, techMap={}, epsMap={}, newsDigest=[], analystMap={}, earningsMap={}, wlData=[];
  var peerMap={}, earnPreviewMap={};

  var hlds = qMode
    ? HOLDINGS.filter(function(h){return h.th==='Benchmark';}).concat(HOLDINGS.filter(function(h){return h.th!=='Benchmark';}).slice(0,15))
    : HOLDINGS;

  setP(2,'Fetching quotes...');

  var apiErrors=[];
  function fetchBatch(batch){
    return Promise.allSettled(batch.map(function(h){return fhub('/quote?symbol='+h.t);}))
      .then(function(results){
        results.forEach(function(res,i){
          var h=batch[i];
          if(res.status==='fulfilled'){
            var q=res.value;
            // Finnhub returns {} with no fields on bad key — detect this
            if(q.c==null&&q.d==null&&q.dp==null&&Object.keys(q).length<3){
              if(apiErrors.indexOf('Finnhub: key may be invalid or market closed')<0)
                apiErrors.push('Finnhub: key may be invalid or market closed');
            }
            qdata.push({t:h.t,th:h.th,price:q.c||null,change:q.d||null,pct:q.dp||null,high:q.h||null,low:q.l||null});
          } else {
            var msg=res.reason?res.reason.message:'unknown error';
            if(apiErrors.indexOf('Finnhub: '+msg)<0)apiErrors.push('Finnhub: '+msg);
            fails.push(h.t);
            qdata.push({t:h.t,th:h.th,price:null,change:null,pct:null,high:null,low:null});
          }
        });
      });
  }

  var chain=Promise.resolve();
  var bs=5, total=hlds.length;
  for(var bi=0;bi<total;bi+=bs){
    (function(batch,idx){
      chain=chain.then(function(){
        setP(2+Math.round(idx/total*18),'Quotes '+(Math.floor(idx/bs)+1)+'/'+Math.ceil(total/bs));
        return fetchBatch(batch);
      }).then(function(){
        if(idx+bs<total)return slp(6000);
      });
    })(hlds.slice(bi,bi+bs),bi);
  }

  chain=chain.then(function(){
    setP(22,'Fetching ranges...');
    var p2=Promise.resolve();
    var nb=HOLDINGS.filter(function(h){return h.th!=='Benchmark'&&h.th!=='ETF';});
    nb.forEach(function(h){
      p2=p2.then(function(){
        return fhub('/stock/metric?symbol='+h.t+'&metric=all').then(function(r){var m=r.metric||{};rangeMap[h.t]={hi52:m['52WeekHigh']||null,lo52:m['52WeekLow']||null};}).catch(function(){});
      }).then(function(){return slp(1300);})
      .then(function(){
        return fhub('/stock/price-target?symbol='+h.t).then(function(r){if(r&&r.targetMean)targetMap[h.t]={mean:r.targetMean};}).catch(function(){});
      }).then(function(){return slp(1300);});
    });
    return p2;
  });

  chain=chain.then(function(){
    setP(44,'Computing weights + technical...');
    var sh=loadSh(), totalV=0, ranked=[];
    qdata.filter(function(q){return q.th!=='Benchmark'&&q.th!=='ETF'&&q.price!=null;}).forEach(function(q){
      var v=(sh[q.t]||0)*(q.price||0);ranked.push({t:q.t,v:v});totalV+=v;
    });
    ranked.sort(function(a,b){return b.v-a.v;});
    var topTk=ranked.filter(function(x){return x.v>0;}).slice(0,10).map(function(x){return x.t;});
    if(topTk.length<3){topTk=qdata.filter(function(q){return q.th!=='Benchmark'&&q.th!=='ETF'&&q.price!=null;}).sort(function(a,b){return Math.abs(b.pct||0)-Math.abs(a.pct||0);}).slice(0,10).map(function(q){return q.t;});}
    var techTk=['SPY'].concat(topTk);
    var toTs=Math.floor(Date.now()/1000), fromTs=toTs-200*24*3600;
    var p3=Promise.resolve();
    techTk.forEach(function(tk,i){
      p3=p3.then(function(){
        setP(44+Math.round(i/techTk.length*14),'Technical '+(i+1)+'/'+techTk.length+': '+tk);
        return fhub('/stock/candle?symbol='+tk+'&resolution=D&from='+fromTs+'&to='+toTs).then(function(c){
          if(c&&c.s==='ok'&&c.c&&c.c.length>20){
            var cl=c.c,hi=c.h,lo=c.l,vo=c.v,pr=cl[cl.length-1];
            var s20=calcSMA(cl,20),s50=calcSMA(cl,Math.min(50,cl.length-1)),rsi=calcRSI(cl,14);
            var macd=calcMACD(cl),boll=calcBoll(cl),atr=calcATR(hi,lo,cl,14);
            var sig=techSig(s20,s50,rsi,pr,macd,boll);
            var trend='Neutral';
            if(s20&&s50){if(pr>s20&&s20>s50)trend='Uptrend';else if(pr<s20&&s20<s50)trend='Downtrend';else if(pr>s50)trend='Above 50d';else trend='Below 50d';}
            var r30=cl.length>=31?(cl[cl.length-1]-cl[cl.length-31])/cl[cl.length-31]*100:null;
            var r90=cl.length>=91?(cl[cl.length-1]-cl[cl.length-91])/cl[cl.length-91]*100:null;
            var vr=vo&&vo.length>=20?vo[vo.length-1]/(vo.slice(-20).reduce(function(a,b){return a+b;},0)/20):null;
            var fib=calcFib(hi,lo,cl);
            techMap[tk]={s20:s20,s50:s50,rsi:rsi,macd:macd,boll:boll,atr:atr,fib:fib,sig:sig,trend:trend,r30:r30,r90:r90,vr:vr};
          }
        }).catch(function(){});
      }).then(function(){return slp(1500);});
    });
    return p3;
  });

  chain=chain.then(function(){
    var spy=techMap['SPY']||null;
    Object.keys(techMap).forEach(function(tk){
      if(tk==='SPY')return;
      var v=techMap[tk];
      v.a30=(v.r30!=null&&spy&&spy.r30!=null)?v.r30-spy.r30:null;
      v.a90=(v.r90!=null&&spy&&spy.r90!=null)?v.r90-spy.r90:null;
    });
  });

  chain=chain.then(function(){
    setP(60,'Fetching earnings (Finnhub batch)...');
    // Fetch in parallel batches of 5 to avoid serial 40-second chain
    var epsTk=HOLDINGS.filter(function(h){return h.th!=='Benchmark'&&h.th!=='ETF';}).map(function(h){return h.t;});
    function processEpsResult(tk,e){
      if(e&&e.length>0){
        var beatStreak=0,missStreak=0,avgSurp=0,validQ=0;
        e.forEach(function(q){
          if(q.surprisePercent!=null){
            avgSurp+=q.surprisePercent;validQ++;
            if(q.surprisePercent>=0)beatStreak++;else missStreak++;
          }
        });
        epsMap[tk]={
          date:e[0].period,actual:e[0].actual,est:e[0].estimate,surpPct:e[0].surprisePercent,
          avgSurp4:validQ>0?avgSurp/validQ:null,
          beatStreak:e[0].surprisePercent>=0?beatStreak:0,
          missStreak:e[0].surprisePercent<0?missStreak:0,
          quarters:e.length,source:'finnhub'
        };
      }
    }
    var epsBatches=[];
    for(var ei=0;ei<epsTk.length;ei+=5)epsBatches.push(epsTk.slice(ei,ei+5));
    var p4=Promise.resolve();
    epsBatches.forEach(function(batch,bi){
      p4=p4.then(function(){
        setP(60+Math.round(bi/epsBatches.length*8),'Earnings batch '+(bi+1)+'/'+epsBatches.length+'...');
        return Promise.allSettled(batch.map(function(tk){
          return fhub('/stock/earnings?symbol='+tk+'&limit=4').then(function(e){processEpsResult(tk,e);});
        }));
      }).then(function(){return bi<epsBatches.length-1?slp(3500):null;});
    });
    return p4;
  });

  // FMP fallback: fill epsMap gaps using income-statement for any holding Finnhub missed
  chain=chain.then(function(){
    setP(68,'Earnings fallback (FMP)...');
    var missing=HOLDINGS.filter(function(h){
      return h.th!=='Benchmark'&&h.th!=='ETF'&&!epsMap[h.t];
    }).map(function(h){return h.t;}).slice(0,20);
    var pFmp=Promise.resolve();
    missing.forEach(function(tk){
      pFmp=pFmp.then(function(){
        return fmp('/income-statement?symbol='+tk+'&period=quarter&limit=5').then(function(inc){
          if(!inc||inc.length<2)return;
          var latest=inc[0];
          var prior=inc[4]||inc[inc.length-1];
          var ttmEps=inc.slice(0,Math.min(4,inc.length)).reduce(function(s,q){return s+(q.eps||0);},0);
          var yoyGr=(prior.eps&&prior.eps!==0)?(latest.eps-prior.eps)/Math.abs(prior.eps)*100:null;
          // Estimate surprise using revenue beat as proxy if no explicit surprise
          epsMap[tk]={
            date:latest.date||'',
            actual:latest.eps||null,
            est:null,
            surpPct:null,
            avgSurp4:null,
            beatStreak:0,missStreak:0,
            ttmEps:ttmEps,
            yoyGr:yoyGr,
            source:'fmp-income'
          };
        }).catch(function(){});
      }).then(function(){return slp(300);});
    });
    return pFmp;
  });

  chain=chain.then(function(){
    setP(64,'Earnings calendar...');
    var from=new Date().toISOString().slice(0,10);
    var to=new Date(Date.now()+90*24*3600*1000).toISOString().slice(0,10);
    return fhub('/calendar/earnings?from='+from+'&to='+to).then(function(ec){
      (ec.earningsCalendar||[]).forEach(function(e){if(HOLDINGS.some(function(h){return h.t===e.symbol;}))earningsMap[e.symbol]=e.date;});
    }).catch(function(){});
  }).then(function(){return slp(1300);});

  chain=chain.then(function(){
    setP(67,'Fetching news...');
    var valid=qdata.filter(function(q){return q.pct!=null;});
    valid.sort(function(a,b){return Math.abs(b.pct||0)-Math.abs(a.pct||0);});
    var newsTk=valid.slice(0,10).map(function(q){return q.t;});
    var p6=Promise.resolve();
    newsTk.forEach(function(tk){
      p6=p6.then(function(){
        var today=new Date().toISOString().slice(0,10);
        var yest=new Date(Date.now()-2*86400000).toISOString().slice(0,10);
        return fhub('/company-news?symbol='+tk+'&from='+yest+'&to='+today).then(function(n){if(n&&n.length>0)newsDigest.push({t:tk,hl:san(n[0].headline),src:san(n[0].source)});}).catch(function(){});
      }).then(function(){return slp(1300);});
    });
    return p6;
  });

  chain=chain.then(function(){
    setP(74,'Analyst ratings...');
    var aTk=Object.keys(techMap).filter(function(t){return t!=='SPY';}).slice(0,8);
    var p7=Promise.resolve();
    aTk.forEach(function(tk){
      p7=p7.then(function(){
        return fhub('/stock/recommendation?symbol='+tk).then(function(r){if(r&&r.length>0)analystMap[tk]={buy:r[0].strongBuy+r[0].buy,hold:r[0].hold,sell:r[0].sell+r[0].strongSell};}).catch(function(){});
      }).then(function(){return slp(1300);});
    });
    return p7;
  });

  chain=chain.then(function(){
    setP(80,'Watchlist...');
    var wlTk=loadWL();
    var p8=Promise.resolve();
    wlTk.forEach(function(tk){
      var wd={t:tk,price:null,pct:null,hi52:null,lo52:null,target:null};
      p8=p8.then(function(){
        return fhub('/quote?symbol='+tk).then(function(q){wd.price=q.c||null;wd.pct=q.dp||null;}).catch(function(){});
      }).then(function(){return slp(1300);})
      .then(function(){return fhub('/stock/metric?symbol='+tk+'&metric=all').then(function(r){var m=r.metric||{};wd.hi52=m['52WeekHigh']||null;wd.lo52=m['52WeekLow']||null;}).catch(function(){});})
      .then(function(){return slp(1300);})
      .then(function(){return fhub('/stock/price-target?symbol='+tk).then(function(r){if(r&&r.targetMean)wd.target=r.targetMean;}).catch(function(){});})
      .then(function(){wlData.push(wd);return slp(1300);});
    });
    return p8;
  });

  chain=chain.then(function(){
    setP(86,'Peer comparison (FMP)...');
    var sh=loadSh();
    var ranked=qdata.filter(function(q){return q.th!=='Benchmark'&&q.th!=='ETF'&&q.price!=null;})
      .map(function(q){return{t:q.t,v:(sh[q.t]||0)*(q.price||0)};})
      .sort(function(a,b){return b.v-a.v;}).slice(0,10).map(function(x){return x.t;});
    if(ranked.length<3){
      ranked=qdata.filter(function(q){return q.th!=='Benchmark'&&q.th!=='ETF'&&q.price!=null;})
        .slice(0,8).map(function(q){return q.t;});
    }

    var p9=Promise.resolve();
    ranked.forEach(function(tk){
      p9=p9.then(function(){
        return fmp('/ratios-ttm?symbol='+tk).then(function(r){
          var d=r&&r.length?r[0]:r||{};
          peerMap[tk]=peerMap[tk]||{};
          peerMap[tk].ticker=tk;
          peerMap[tk].margin=d.netProfitMarginTTM!=null?(d.netProfitMarginTTM*100):null;
          peerMap[tk].grossMargin=d.grossProfitMarginTTM!=null?(d.grossProfitMarginTTM*100):null;
          peerMap[tk].peers=peerMap[tk].peers||[];
        }).catch(function(){peerMap[tk]=peerMap[tk]||{ticker:tk,margin:null,peers:[]};});
      }).then(function(){return slp(300);})
      .then(function(){
        return fmp('/key-metrics-ttm?symbol='+tk).then(function(r){
          var d=r&&r.length?r[0]:r||{};
          if(peerMap[tk]){
            peerMap[tk].evSales=d.evToSalesTTM||null;
            peerMap[tk].evEbitda=d.evToEBITDATTM||null;
          }
        }).catch(function(){});
      }).then(function(){return slp(300);})
      .then(function(){
        return fmp('/profile?symbol='+tk).then(function(r){
          var d=r&&r.length?r[0]:r||{};
          if(peerMap[tk]){
            peerMap[tk].price=d.price||null;
            peerMap[tk].mktCap=d.marketCap||null;
            peerMap[tk].beta=d.beta||null;
            if(peerMap[tk].mktCap&&peerMap[tk].margin&&peerMap[tk].evSales){
              var approxRev=peerMap[tk].mktCap/(peerMap[tk].evSales||1);
              var approxNetIncome=approxRev*(peerMap[tk].margin/100);
              peerMap[tk].derivedPE=approxNetIncome>0?peerMap[tk].mktCap/approxNetIncome:null;
            }
          }
        }).catch(function(){});
      }).then(function(){return slp(300);})
      .then(function(){
        return fmp('/stock-peers?symbol='+tk).then(function(peers){
          if(!peers||!peers.length)return;
          var peerTickers=peers.filter(function(p){return p.symbol&&p.symbol!==tk;}).slice(0,3);
          var pp=Promise.resolve();
          peerTickers.forEach(function(peerObj){
            var pt=peerObj.symbol;
            pp=pp.then(function(){
              return fmp('/ratios-ttm?symbol='+pt).then(function(r){
                var d=r&&r.length?r[0]:r||{};
                var pq=qdata.filter(function(q){return q.t===pt;})[0];
                if(peerMap[tk]){
                  peerMap[tk].peers.push({
                    t:pt,
                    price:peerObj.price||null,
                    pct:pq?pq.pct:null,
                    margin:d.netProfitMarginTTM!=null?(d.netProfitMarginTTM*100):null,
                    grossMargin:d.grossProfitMarginTTM!=null?(d.grossProfitMarginTTM*100):null,
                    mktCap:peerObj.mktCap||null,
                    derivedPE:null
                  });
                }
              }).catch(function(){
                if(peerMap[tk])peerMap[tk].peers.push({t:pt,price:peerObj.price||null,pct:null,margin:null,grossMargin:null,mktCap:peerObj.mktCap||null,derivedPE:null});
              });
            }).then(function(){return slp(300);});
          });
          return pp;
        }).catch(function(){});
      }).then(function(){return slp(300);});
    });
    return p9;
  });

  chain=chain.then(function(){
    setP(92,'Earnings previews (FMP)...');
    // Expand window to 90 days so more upcoming reports are covered
    var upcoming=Object.keys(earningsMap).filter(function(t){
      var d=new Date(earningsMap[t]);var now=new Date();
      return d>now&&(d-now)<90*24*3600*1000;
    });
    var p10=Promise.resolve();
    upcoming.slice(0,12).forEach(function(tk){
      p10=p10.then(function(){
        // Primary: analyst-estimates
        return fmp('/analyst-estimates?symbol='+tk+'&period=quarter&limit=2').then(function(est){
          if(est&&est.length>0){
            var next=est[0];
            earnPreviewMap[tk]=earnPreviewMap[tk]||{};
            earnPreviewMap[tk].epsEst=next.estimatedEpsAvg||null;
            earnPreviewMap[tk].epsHigh=next.estimatedEpsHigh||null;
            earnPreviewMap[tk].epsLow=next.estimatedEpsLow||null;
            earnPreviewMap[tk].revEst=next.estimatedRevenueAvg||null;
            earnPreviewMap[tk].revHigh=next.estimatedRevenueHigh||null;
            earnPreviewMap[tk].revLow=next.estimatedRevenueLow||null;
            earnPreviewMap[tk].period=next.date||null;
            // Year-ago comparison if second quarter available
            if(est.length>1){
              earnPreviewMap[tk].epsYoY=next.estimatedEpsAvg&&est[1].estimatedEpsAvg
                ?(next.estimatedEpsAvg-est[1].estimatedEpsAvg)/Math.abs(est[1].estimatedEpsAvg)*100
                :null;
            }
          } else {
            // Fallback: derive forward estimate from last TTM EPS + historical growth
            return fmp('/income-statement?symbol='+tk+'&period=quarter&limit=5').then(function(inc){
              if(inc&&inc.length>=2){
                var latest=inc[0];
                var prior=inc[4]||inc[inc.length-1];
                var ttmEps=inc.slice(0,4).reduce(function(s,q){return s+(q.eps||0);},0);
                var yoyGr=prior.eps&&prior.eps!==0?(latest.eps-prior.eps)/Math.abs(prior.eps)*100:null;
                earnPreviewMap[tk]={
                  epsEst:ttmEps*1.04, // rough 4% forward growth assumption
                  revEst:null,
                  derivedFromTTM:true,
                  ttmEps:ttmEps,
                  yoyGr:yoyGr,
                  note:'Estimated from TTM EPS (no analyst consensus available)'
                };
              } else {
                earnPreviewMap[tk]={note:'Estimates unavailable'};
              }
            }).catch(function(){
              earnPreviewMap[tk]={note:'Estimates unavailable'};
            });
          }
        }).catch(function(){
          earnPreviewMap[tk]={note:'Estimates unavailable'};
        });
      }).then(function(){return slp(300);});
    });
    return p10;
  });

  chain=chain.then(function(){
    render(qdata,fails,rangeMap,targetMap,techMap,epsMap,newsDigest,analystMap,earningsMap,wlData,peerMap,earnPreviewMap);
  }).catch(function(e){
    document.getElementById('progress').style.display='none';
    document.getElementById('report').style.display='block';
    document.getElementById('report').innerHTML='<div class="warn">Error: '+san(e.message)+'</div>';
  });
}

function render(qdata,fails,rangeMap,targetMap,techMap,epsMap,newsDigest,analystMap,earningsMap,wlData,peerMap,earnPreviewMap){
  setP(90,'Rendering...');
  var valid=qdata.filter(function(q){return q.pct!=null&&q.th!=='Benchmark';});
  var sorted=valid.slice().sort(function(a,b){return b.pct-a.pct;});
  var avgPct=valid.length?valid.reduce(function(s,q){return s+q.pct;},0)/valid.length:0;
  var gainCount=valid.filter(function(q){return q.pct>0;}).length;
  var lossCount=valid.filter(function(q){return q.pct<0;}).length;
  var spy=qdata.filter(function(q){return q.t==='SPY';})[0];
  var qqq=qdata.filter(function(q){return q.t==='QQQ';})[0];
  var sh=loadSh(), totalV=0, wm={};
  valid.forEach(function(q){var v=(sh[q.t]||0)*(q.price||0);wm[q.t]={sh:sh[q.t]||0,v:v};totalV+=v;});
  if(totalV>0)Object.keys(wm).forEach(function(t){wm[t].pct=wm[t].v/totalV*100;});
  var spm={};
  valid.forEach(function(q){if(!spm[q.th])spm[q.th]={sum:0,cnt:0};spm[q.th].sum+=q.pct;spm[q.th].cnt++;});
  var sectors=Object.keys(spm).map(function(n){return{n:n,avg:spm[n].sum/spm[n].cnt};}).sort(function(a,b){return b.avg-a.avg;});
  var alerts=[];
  valid.forEach(function(q){
    var r=rangeMap[q.t]||{},pt=targetMap[q.t];
    if(Math.abs(q.pct)>=3)alerts.push({t:q.t,pct:q.pct,reason:(q.pct>=0?'+':'')+q.pct.toFixed(1)+'% daily move'});
    else if(r.hi52&&q.price&&(r.hi52-q.price)/r.hi52*100<=5)alerts.push({t:q.t,pct:q.pct,reason:'Near 52w high ($'+r.hi52.toFixed(2)+')'});
    else if(r.lo52&&q.price&&(q.price-r.lo52)/r.lo52*100<=5)alerts.push({t:q.t,pct:q.pct,reason:'Near 52w low ($'+r.lo52.toFixed(2)+')'});
    if(pt&&q.price&&(pt.mean-q.price)/q.price*100<=3)alerts.push({t:q.t,pct:q.pct,reason:'Near analyst target ($'+pt.mean.toFixed(0)+')'});
  });

  var today=new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  var totalFmt=totalV>0?'$'+totalV.toLocaleString('en-US',{maximumFractionDigits:0}):'Enter shares to calculate';
  var topPos=Object.keys(wm).filter(function(t){return wm[t].pct>0;}).sort(function(a,b){return wm[b].pct-wm[a].pct;}).slice(0,10).map(function(t){return t+' '+wm[t].pct.toFixed(1)+'%';}).join(', ');

  var html='<div class="rhead"><h2>Close-of-Market Brief</h2><span class="rdate">'+today+'</span><div style="display:flex;gap:0.5rem;"><button class="rbtn" onclick="window.print()">[P] Print</button><button class="rbtn" onclick="window.exportData()">[E] Export</button><button class="rbtn" onclick="window.importData()">[I] Import</button><button class="rbtn" onclick="window.openHoldingsManager()">[H] Holdings</button><button class="rbtn" onclick="location.reload()">[R] Reload</button></div></div>';
  if(apiErrors.length)html+='<div class="warn" style="border-color:rgba(255,100,100,0.5)"><strong>API Errors detected:</strong> '+apiErrors.join(' | ')+'<br><small>Check your API keys and browser console (F12) for details.</small></div>';
  if(fails.length)html+='<div class="warn">Tickers with no quote data: '+fails.join(', ')+'</div>';

  html+='<div class="scorecard">';
  html+='<div class="sc"><div class="sc-label">Portfolio Avg</div><div class="sc-val '+(avgPct>=0?'up':'dn')+'">'+(avgPct>=0?'+':'')+avgPct.toFixed(2)+'%</div><div class="sc-sub">'+gainCount+' up / '+lossCount+' dn</div></div>';
  html+='<div class="sc"><div class="sc-label">Portfolio Value</div><div class="sc-val" style="font-size:0.95rem;">'+totalFmt+'</div></div>';
  html+='<div class="sc"><div class="sc-label">SPY</div><div class="sc-val">'+fPct(spy?spy.pct:null)+'</div><div class="sc-sub">Benchmark</div></div>';
  html+='<div class="sc"><div class="sc-label">QQQ</div><div class="sc-val">'+fPct(qqq?qqq.pct:null)+'</div><div class="sc-sub">Benchmark</div></div>';
  html+='<div class="sc"><div class="sc-label">Top Mover</div><div class="sc-val" style="font-size:1rem;">'+(sorted[0]?sorted[0].t:'--')+'</div><div class="sc-sub">'+(sorted[0]?fPct(sorted[0].pct):'--')+'</div></div>';
  html+='<div class="sc"><div class="sc-label">Alerts</div><div class="sc-val" style="color:'+(alerts.length?'var(--yellow)':'var(--green)')+'">'+alerts.length+'</div><div class="sc-sub">'+(alerts.length?'Flags raised':'All clear')+'</div></div>';
  html+='</div>';

  // ── WHAT CHANGED SINCE YESTERDAY ────────────────────────────────────────────
  var arch=loadArch();
  if(arch.length>=1){
    var yest=arch[0];
    var yesterdayLines=(yest.holdStr||'').split('\n');
    var changedRows=[];
    valid.forEach(function(q){
      var tm=techMap[q.t];
      var pt=targetMap[q.t];
      // Parse yesterday's line for this ticker
      var yLine=yesterdayLines.filter(function(l){return l.indexOf(q.t+'(')===0;})[0]||'';
      var changes=[];
      // Signal change
      if(tm){
        var ySignalM=yLine.match(/(STRONG BUY|BUY|HOLD|WEAK|SELL|N\/A)/);
        var ySignal=ySignalM?ySignalM[1]:null;
        if(ySignal&&ySignal!==tm.sig)changes.push({label:'Signal',from:ySignal,to:tm.sig,up:['STRONG BUY','BUY'].indexOf(tm.sig)>['STRONG BUY','BUY'].indexOf(ySignal)});
      }
      // Target change
      if(pt){
        var yTgtM=yLine.match(/tgt:\$(\d+)/);
        var yTgt=yTgtM?parseFloat(yTgtM[1]):null;
        if(yTgt&&Math.abs(pt.mean-yTgt)>0.5)changes.push({label:'Target',from:'$'+yTgt.toFixed(0),to:'$'+pt.mean.toFixed(0),up:pt.mean>yTgt});
      }
      if(changes.length)changedRows.push({t:q.t,changes:changes,pct:q.pct});
    });
    if(changedRows.length){
      html+='<div class="section" style="border-color:rgba(100,255,218,0.2)"><h3>What Changed Since Yesterday</h3>';
      changedRows.forEach(function(r){
        html+='<div class="chg-row"><span class="chg-tk">'+r.t+'</span>';
        r.changes.forEach(function(c){
          html+='<span class="chg-item">'+c.label+': <span class="'+(c.up?'chg-up':'chg-dn')+'">'+c.from+' → '+c.to+'</span></span> ';
        });
        html+='<span class="'+(r.pct>=0?'up':'dn')+'" style="margin-left:auto;font-family:monospace;">'+(r.pct>=0?'+':'')+r.pct.toFixed(2)+'%</span>';
        html+='</div>';
      });
      html+='</div>';
    }
  }

  if(alerts.length){html+='<div class="section" style="border-color:rgba(233,69,96,0.3)"><h3>Alert Flags</h3>';alerts.forEach(function(a){html+='<div class="abar"><span class="abar-tk">'+a.t+'</span><span class="abar-r">'+a.reason+'</span><span class="abar-p '+(a.pct>=0?'up':'dn')+'">'+(a.pct>=0?'+':'')+a.pct.toFixed(2)+'%</span></div>';});html+='</div>';}

  var maxS=0.01;sectors.forEach(function(s){if(Math.abs(s.avg)>maxS)maxS=Math.abs(s.avg);});
  html+='<div class="section"><h3>Sector Performance</h3>';
  sectors.filter(function(s){return s.n!=='Benchmark'&&s.n!=='ETF';}).forEach(function(s){
    html+='<div class="srow"><span class="slabel">'+s.n+'</span><div class="sbar-wrap"><div class="sbar-fill" style="width:'+Math.abs(s.avg)/maxS*100+'%;background:'+(s.avg>=0?'var(--green)':'var(--red)')+'"></div></div><span class="spct '+(s.avg>=0?'up':'dn')+'">'+(s.avg>=0?'+':'')+s.avg.toFixed(2)+'%</span></div>';
  });
  html+='</div>';

  if(totalV>0){
    var sectorW={};
    valid.forEach(function(q){if(!sectorW[q.th])sectorW[q.th]=0;sectorW[q.th]+=(wm[q.t]?wm[q.t].pct:0);});
    var swItems=Object.keys(sectorW).filter(function(k){return sectorW[k]>0;}).sort(function(a,b){return sectorW[b]-sectorW[a];});
    var mxW=0.01;swItems.forEach(function(k){if(sectorW[k]>mxW)mxW=sectorW[k];});
    html+='<div class="section"><h3>Portfolio Concentration</h3>';
    swItems.forEach(function(k){var over=sectorW[k]>25;html+='<div class="srow"><span class="slabel">'+k+'</span><div class="sbar-wrap"><div class="sbar-fill" style="width:'+sectorW[k]/mxW*100+'%;background:'+(over?'var(--yellow)':'var(--green)')+'"></div></div><span class="spct" style="color:'+(over?'var(--yellow)':'var(--white)')+'">'+sectorW[k].toFixed(1)+'%'+(over?' (!)':'')+'</span></div>';});
    html+='</div>';
  }

  // ── PORTFOLIO HEAT MAP ──────────────────────────────────────────────────────
  (function(){
    var hmItems=valid.filter(function(q){return q.price!=null;}).map(function(q){
      var w=wm[q.t]?wm[q.t].pct:0;
      return{t:q.t,pct:q.pct,w:w};
    }).filter(function(x){return x.w>0||x.pct!=null;});
    // If no weights (no shares entered), size by equal weight
    var hasWeights=hmItems.some(function(x){return x.w>0;});
    if(!hasWeights)hmItems.forEach(function(x){x.w=1;});
    hmItems.sort(function(a,b){return b.w-a.w;});
    var maxW=Math.max.apply(null,hmItems.map(function(x){return x.w;}));
    if(maxW>0&&hmItems.length){
      html+='<div class="section"><h3>Portfolio Heat Map <span style="font-size:0.65rem;color:var(--dim);font-weight:400;">(size = position weight · color = day %)</span></h3><div class="hmap-wrap">';
      hmItems.forEach(function(item){
        var sz=Math.max(48,Math.round((item.w/maxW)*120));
        var p=item.pct||0;
        var intensity=Math.min(1,Math.abs(p)/4);
        var bg=p>=0
          ?'rgba('+(Math.round(30-20*intensity))+','+(Math.round(180+50*intensity))+','+(Math.round(130+80*intensity))+',0.85)'
          :'rgba('+(Math.round(200+55*intensity))+','+(Math.round(60-40*intensity))+','+(Math.round(60-40*intensity))+',0.85)';
        if(Math.abs(p)<0.05)bg='rgba(80,90,120,0.7)';
        html+='<div class="hmap-cell" style="width:'+sz+'px;height:'+sz+'px;background:'+bg+'" title="'+item.t+': '+(p>=0?'+':'')+p.toFixed(2)+'%">';
        html+='<span class="hmap-tk">'+item.t+'</span>';
        if(sz>=60)html+='<span class="hmap-pct">'+(p>=0?'+':'')+p.toFixed(1)+'%</span>';
        html+='</div>';
      });
      html+='</div></div>';
    }
  })();

  // ── OPPORTUNITY RANKING ──────────────────────────────────────────────────────
  (function(){
    var oppRows=valid.filter(function(q){
      return targetMap[q.t]&&q.price&&targetMap[q.t].mean>0;
    }).map(function(q){
      var pt=targetMap[q.t];
      var upside=(pt.mean-q.price)/q.price*100;
      var wt=wm[q.t]?wm[q.t].pct:0;
      return{t:q.t,price:q.price,target:pt.mean,upside:upside,wt:wt,pct:q.pct};
    }).sort(function(a,b){return b.upside-a.upside;});
    if(oppRows.length){
      var maxUp=Math.max.apply(null,oppRows.map(function(x){return Math.abs(x.upside);}));
      html+='<div class="section"><h3>Opportunity Ranking <span style="font-size:0.65rem;color:var(--dim);font-weight:400;">(by analyst upside to target)</span></h3>';
      html+='<table class="htable"><thead><tr><th>Ticker</th><th class="r">Price</th><th class="r">Target</th><th class="r">Upside</th><th>Potential</th><th class="r">Weight</th><th class="r">Day%</th></tr></thead><tbody>';
      oppRows.forEach(function(r){
        var barW=maxUp>0?Math.abs(r.upside)/maxUp*100:0;
        var barColor=r.upside>=0?'var(--green)':'var(--red)';
        html+='<tr><td class="tk">'+r.t+'</td>';
        html+='<td class="r">$'+r.price.toFixed(2)+'</td>';
        html+='<td class="r" style="color:var(--dim)">$'+r.target.toFixed(0)+'</td>';
        html+='<td class="r"><span class="'+(r.upside>=0?'up':'dn')+'">'+(r.upside>=0?'+':'')+r.upside.toFixed(1)+'%</span></td>';
        html+='<td><div class="opp-bar-wrap"><div class="opp-bar-fill" style="width:'+barW+'%;background:'+barColor+'"></div></div></td>';
        html+='<td class="r" style="color:var(--dim)">'+(r.wt>0?r.wt.toFixed(1)+'%':'--')+'</td>';
        html+='<td class="r">'+fPct(r.pct)+'</td>';
        html+='</tr>';
      });
      html+='</tbody></table></div>';
    }
  })();

  var peerKeys=Object.keys(peerMap);
  if(peerKeys.length){

  document.querySelectorAll('.note-in').forEach(function(ta){var tk=ta.getAttribute('data-tk');ta.addEventListener('input',function(){saveNt(tk,ta.value);});});
  document.querySelectorAll('[data-wltk]').forEach(function(inp){var tk=inp.getAttribute('data-wltk');inp.addEventListener('input',function(){saveWLN(tk,inp.value);});});
  document.querySelectorAll('[data-rmtk]').forEach(function(btn){var tk=btn.getAttribute('data-rmtk');btn.addEventListener('click',function(){window.rmWL(tk);});});

  var holdStr=valid.map(function(q){
    var w=wm[q.t],pt=targetMap[q.t],tm=techMap[q.t],shv=sh[q.t]||0,val=shv*(q.price||0);
    return q.t+'('+san(q.th)+'): $'+(q.price||0).toFixed(2)+' '+(q.pct>=0?'+':'')+q.pct.toFixed(2)+'%'+(shv>0?' '+shv+'sh($'+val.toLocaleString('en-US',{maximumFractionDigits:0})+')':'')+(w&&w.pct>0?' wt:'+w.pct.toFixed(1)+'%':'')+(pt?' tgt:$'+pt.mean.toFixed(0):'')+(tm?' RSI:'+tm.rsi.toFixed(0)+' '+tm.sig+' '+tm.trend:'');
  }).join('\n');
  var techStr=Object.keys(techMap).filter(function(t){return t!=='SPY';}).map(function(t){var v=techMap[t],p=[];p.push('['+v.sig+'] '+v.trend);if(v.rsi!=null)p.push('RSI:'+v.rsi.toFixed(0));if(v.s20&&v.s50)p.push('SMA20:$'+v.s20.toFixed(2)+' SMA50:$'+v.s50.toFixed(2));if(v.macd&&v.macd.hist!=null)p.push('MACD:'+(v.macd.hist>=0?'+':'')+v.macd.hist.toFixed(2));if(v.boll)p.push('Boll:'+v.boll.pct.toFixed(0)+'%'+(v.boll.pct>80?' EXTENDED':v.boll.pct<20?' OVERSOLD':''));if(v.a30!=null)p.push('RS30:'+(v.a30>=0?'+':'')+v.a30.toFixed(1)+'%vsSPY');if(v.a90!=null)p.push('RS90:'+(v.a90>=0?'+':'')+v.a90.toFixed(1)+'%vsSPY');if(v.fib&&v.fib.nearestName)p.push('Fib:'+v.fib.nearestName+'@$'+v.fib.nearest.toFixed(2)+(Math.abs(v.fib.nearPct)<2?' NEAR-LEVEL':''));return t+': '+p.join(', ');}).join('\n')||'none';
  // Build epsStr from three sources in priority order:
  // 1. Finnhub surprise data (best - has beat/miss %)
  // 2. FMP income-statement fallback (TTM EPS + YoY)
  // 3. peerMap data already fetched - mine net margin + EV/EBITDA as earnings quality proxy
  var epsLines=[];
  // Source 1 & 2: direct epsMap entries
  Object.keys(epsMap).forEach(function(t){
    var e=epsMap[t];
    var s='';
    if(e.source==='finnhub'&&e.surpPct!=null){
      s=t+': act $'+(e.actual||0).toFixed(2)+' est $'+(e.est||0).toFixed(2)+' ('+(e.surpPct>=0?'+':'')+e.surpPct.toFixed(1)+'%) '+e.date;
      if(e.avgSurp4!=null)s+=' | 4Q avg: '+(e.avgSurp4>=0?'+':'')+e.avgSurp4.toFixed(1)+'%';
      if(e.beatStreak>1)s+=' | '+e.beatStreak+'Q beat streak';
      if(e.missStreak>1)s+=' | '+e.missStreak+'Q miss streak';
    } else if(e.source==='fmp-income'&&(e.actual!=null||e.ttmEps!=null)){
      s=t+': TTM EPS $'+(e.ttmEps!=null?e.ttmEps.toFixed(2):'n/a');
      if(e.yoyGr!=null)s+=' | YoY EPS chg: '+(e.yoyGr>=0?'+':'')+e.yoyGr.toFixed(1)+'%';
    }
    if(s)epsLines.push(s);
  });
  // Source 3: mine peerMap (already fetched) for holdings not in epsMap
  // peerMap has netMargin, grossMargin, evSales, evEbitda for top holdings
  Object.keys(peerMap).forEach(function(tk){
    if(epsMap[tk])return; // already have better data
    var pm=peerMap[tk];
    if(!pm)return;
    var parts=[];
    if(pm.margin!=null)parts.push('net margin '+pm.margin.toFixed(1)+'%');
    if(pm.grossMargin!=null)parts.push('gross margin '+pm.grossMargin.toFixed(1)+'%');
    if(pm.evEbitda!=null)parts.push('EV/EBITDA '+pm.evEbitda.toFixed(1)+'x');
    if(pm.derivedPE!=null)parts.push('est P/E '+pm.derivedPE.toFixed(1)+'x');
    if(parts.length)epsLines.push(tk+' (profitability proxy): '+parts.join(', '));
  });
  // Source 4: for any remaining holding with a quote, note price performance as proxy
  valid.forEach(function(q){
    if(epsMap[q.t]||peerMap[q.t])return;
    var tm=techMap[q.t];
    if(tm&&tm.r30!=null)epsLines.push(q.t+' (no EPS data): 30d return '+(tm.r30>=0?'+':'')+tm.r30.toFixed(1)+'% vs SPY, RSI '+tm.rsi.toFixed(0));
  });
  var epsStr=epsLines.length?epsLines.join('\n'):'Profitability data unavailable — rely on technical and sector signals.';
  var newsStr=newsDigest.map(function(n){return n.t+': '+n.hl;}).join('\n')||'none';
  var earnStr=Object.keys(earningsMap).map(function(t){return t+':'+earningsMap[t];}).join(', ')||'none';
  var alertStr=alerts.length?alerts.map(function(a){return a.t+': '+a.reason;}).join('\n'):'none';
  var analStr=Object.keys(analystMap).map(function(t){var v=analystMap[t],pt=targetMap[t];return t+': '+v.buy+'B/'+v.hold+'H/'+v.sell+'S'+(pt?' tgt:$'+pt.mean.toFixed(0):'');}).join('\n')||'none';
  var wlStr=wlData.filter(function(w){return w.price!=null;}).map(function(w){var up=w.target&&w.price?(w.target-w.price)/w.price*100:null;return'WATCH '+w.t+': $'+(w.price||0).toFixed(2)+' '+(w.pct>=0?'+':'')+w.pct.toFixed(2)+'%'+(up!=null?' upside:'+(up>=0?'+':'')+up.toFixed(1)+'%':'')+(w.target?' tgt:$'+w.target.toFixed(0):'');}).join('\n')||'none';

  var isDecision=(document.getElementById('mode-sel').value==='decision');
  var prompt=isDecision
    ? 'You are a seasoned portfolio manager reviewing your own portfolio at close of market. Answer ONLY these three questions in flowing prose, one paragraph each, separated by ---. Be specific: name tickers and cite numbers.\n\n1. WHAT GENUINELY MATTERS TODAY? Of everything that moved or was reported today, what actually changes the long-term picture for any holding? Ignore noise.\n\n2. HAS MY INVESTMENT CASE CHANGED? For any holding where something happened today — earnings, guidance, macro, competitive news — has the original reason for owning it strengthened, weakened, or held steady? Name the holding and explain.\n\n3. WHERE WOULD I ADD CAPITAL? If I had fresh money today, which three holdings represent the best risk/reward given current positioning, valuation, and momentum? Rank them and explain briefly.\n\nDATA:\nPortfolio avg: '+(avgPct>=0?'+':'')+avgPct.toFixed(2)+'% | SPY: '+(spy&&spy.pct!=null?spy.pct.toFixed(2):'n/a')+'% | QQQ: '+(qqq&&qqq.pct!=null?qqq.pct.toFixed(2):'n/a')+'%\nTop movers: '+sorted.slice(0,5).map(function(q){return q.t+' '+(q.pct>=0?'+':'')+q.pct.toFixed(2)+'%';}).join(', ')+'\nBottom: '+sorted.slice(-3).reverse().map(function(q){return q.t+' '+(q.pct>=0?'+':'')+q.pct.toFixed(2)+'%';}).join(', ')+'\nAlerts: '+alertStr+'\nTechnical: '+techStr+'\nNews: '+newsStr+'\n\nWrite the three-paragraph decision brief now.'
    : 'You are a senior portfolio analyst. Write a professional close-of-market brief in 8-10 paragraphs of flowing prose. Separate paragraphs with ---. No bullet points.\n'
    +'RULES: Do NOT mention insider trading or Form 4 filings under any circumstances. Every paragraph must name specific tickers and cite specific numbers. NEVER write sentences saying data is unavailable, insufficient, not provided, or that analysis must rely on contextual intelligence due to data gaps — if a specific number is missing, reason from what IS available (technicals, margins, sector trends, recent price action) and write with confidence.\n\n'
    +'Cover in order:\n'
    +'1. MARKET OVERVIEW: Portfolio vs SPY/QQQ. Value if available.\n'
    +'2. NOTABLE MOVERS: Top gainers/decliners with likely drivers.\n'
    +'3. THEMATIC OBSERVATIONS: Sector performance and rotation signals.\n'
    +'4. TECHNICAL PICTURE: Using RSI, SMA20/50 trend, MACD histogram, Bollinger%, ATR, volume, RS vs SPY (RS30/RS90), and Fibonacci retracement levels - write substantive technical analysis. Name tickers and numbers. Cover uptrends, downtrends, overbought/oversold conditions, any holdings sitting at or near key Fibonacci levels (especially 38.2%, 50%, 61.8%), and which holdings are outperforming or underperforming SPY on 30 and 90-day basis.\n'
    +'5. ANALYST DIVERGENCE AND PEER POSITIONING: Where does consensus or targets diverge from price action? Using the peer comparison data, identify which of your holdings are the sector leaders vs laggards on valuation (P/E, forward P/E), growth (revenue growth rate), and profitability (net margin). Note any holdings that look expensive or cheap relative to their peers.\n'
    +'6. EARNINGS QUALITY AND PREVIEW: The EPS section below contains data for every holding in one of three forms: (a) Finnhub surprise data with actual vs estimate and beat/miss streaks, (b) FMP-derived TTM EPS and YoY growth, or (c) profitability proxies (net margin, gross margin, EV/EBITDA, P/E) mined from the peer comparison data. You always have something to work with. Use whichever data is present to assess earnings quality — consistent beaters, margin trajectory, valuation relative to earnings power. ABSOLUTE RULE: do not write any sentence stating that EPS data, surprise history, or consensus estimates were not provided — they are always provided in some form. For upcoming reports in the next 90 days, discuss expected EPS and revenue where available, what a beat or miss means for the stock's technical setup, and which reports represent the greatest portfolio risk.\n'
    +'7. PORTFOLIO CONCENTRATION: Sector weights, overweight/underweight, suggest 2-3 specific stocks for diversification.\n'
    +'8. RISK MANAGEMENT: Based on largest positions and technical picture, suggest specific stop-loss levels or sizing adjustments.\n'
    +'9. WATCHLIST: For each watchlist stock, brief assessment and verdict on entry timing.\n'
    +'10. FORWARD LOOK: Upcoming earnings and near-term outlook.\n\n'
    +'DATA:\n'
    +'Portfolio avg: '+(avgPct>=0?'+':'')+avgPct.toFixed(2)+'% | SPY: '+(spy&&spy.pct!=null?spy.pct.toFixed(2):'n/a')+'% | QQQ: '+(qqq&&qqq.pct!=null?qqq.pct.toFixed(2):'n/a')+'%\n'
    +'Value: '+totalFmt+'\nTop positions: '+topPos+'\n\n'
    +'Holdings:\n'+holdStr+'\n\nAlerts:\n'+alertStr+'\n\nTechnical:\n'+techStr+'\n\nAnalyst:\n'+analStr+'\n\nEPS:\n'+epsStr+'\n\nNews:\n'+newsStr+'\n\nUpcoming earnings: '+earnStr+'\n\nWatchlist:\n'+wlStr+'\n\nPeer comparison (your holding vs sector peers):\n'+Object.keys(peerMap).map(function(tk){var pm=peerMap[tk];return tk+' NetMargin:'+(pm.margin!=null?pm.margin.toFixed(1)+'%':'n/a')+' GrossMargin:'+(pm.grossMargin!=null?pm.grossMargin.toFixed(1)+'%':'n/a')+' EV/Sales:'+(pm.evSales!=null?pm.evSales.toFixed(1):'n/a')+' EV/EBITDA:'+(pm.evEbitda!=null?pm.evEbitda.toFixed(1):'n/a')+'  vs peers: '+pm.peers.map(function(p){return p.t+' NetMgn:'+(p.margin!=null?p.margin.toFixed(1)+'%':'n/a')+' GrossMgn:'+(p.grossMargin!=null?p.grossMargin.toFixed(1)+'%':'n/a');}).join(' | ');}).join('\n')||'none'+'\n\nEarnings estimates (next 30 days):\n'+Object.keys(earnPreviewMap).map(function(tk){
  var ep=earnPreviewMap[tk];
  if(ep.note&&!ep.epsEst&&!ep.ttmEps)return tk+'('+earningsMap[tk]+'): '+ep.note;
  var s=tk+'('+(earningsMap[tk]||'?')+'): EPS est $'+(ep.epsEst!=null?ep.epsEst.toFixed(2):ep.ttmEps!=null?ep.ttmEps.toFixed(2)+'(TTM-derived)':'n/a');
  if(ep.epsLow!=null&&ep.epsHigh!=null)s+=' range $'+ep.epsLow.toFixed(2)+'-$'+ep.epsHigh.toFixed(2);
  if(ep.revEst!=null)s+=' RevEst $'+(ep.revEst/1e9).toFixed(1)+'B';
  if(ep.epsYoY!=null)s+=' YoY EPS chg: '+(ep.epsYoY>=0?'+':'')+ep.epsYoY.toFixed(1)+'%';
  else if(ep.yoyGr!=null)s+=' YoY EPS chg(TTM): '+(ep.yoyGr>=0?'+':'')+ep.yoyGr.toFixed(1)+'%';
  if(ep.derivedFromTTM)s+=' [TTM-derived, no consensus]';
  return s;
}).join('\n')||'none'+'\n\nWrite the complete brief now.';

  // DEBUG: log exactly what Claude receives for EPS
  console.log('=== EPS STRING SENT TO CLAUDE ===');
  console.log(epsStr);
  console.log('=== EARN PREVIEW STRING ===');
  console.log(Object.keys(earnPreviewMap).length+' entries in earnPreviewMap');
  console.log('=== epsMap keys ===');
  console.log(Object.keys(epsMap).join(', ')||'EMPTY');
  console.log('=== peerMap keys ===');
  console.log(Object.keys(peerMap).join(', ')||'EMPTY');

  var briefEl=document.getElementById('brief-stream');
  var fullBrief='';

  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':antKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:6000,stream:true,messages:[{role:'user',content:prompt}]})
  }).then(function(res){
    if(!res.ok)return res.json().then(function(e){throw new Error(e.error?e.error.message:res.statusText);});
    var reader=res.body.getReader(),decoder=new TextDecoder();
    briefEl.innerHTML='<span class="cursor"></span>';
    var NL=String.fromCharCode(10);
    function read(){
      return reader.read().then(function(result){
        if(result.done){
          briefEl.innerHTML=fullBrief.split('---').map(function(p){return p.trim();}).filter(function(p){return p.length>0;}).map(function(p){return'<p>'+p.split(NL).join('<br>')+'</p>';}).join('<hr>');
          saveArch({date:new Date().toISOString(),label:today,brief:fullBrief,avg:avgPct,holdStr:holdStr});
          return;
        }
        var lines2=decoder.decode(result.value).split(NL);
        lines2.forEach(function(line){
          if(line.indexOf('data: ')!==0)return;
          var d=line.slice(6).trim();
          if(d==='[DONE]')return;
          try{var ev=JSON.parse(d);if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){fullBrief+=ev.delta.text;briefEl.innerHTML=fullBrief.split('---').map(function(p){return p.trim();}).filter(function(p){return p.length>0;}).map(function(p){return'<p>'+p.split(NL).join('<br>')+'</p>';}).join('<hr>')+'<span class="cursor"></span>';}}catch(e){}
        });
        return read();
      });
    }
    return read();
  }).catch(function(e){briefEl.innerHTML='<span style="color:var(--red)">Error: '+san(e.message)+'</span>';});
}

document.addEventListener('DOMContentLoaded',function(){
  loadKeys();
  document.getElementById('genbtn').addEventListener('click',function(){
    antKey=document.getElementById('ant-key').value.trim();
    finKey=document.getElementById('fin-key').value.trim();
    fmpKey=document.getElementById('fmp-key').value.trim();
    qMode=document.getElementById('mode-sel').value==='quick';
    var err=document.getElementById('errmsg');
    if(!antKey||antKey.indexOf('sk-ant')!==0){err.textContent='Please enter a valid Anthropic API key.';err.style.display='block';return;}
    if(!finKey){err.textContent='Please enter your Finnhub API key.';err.style.display='block';return;}
    if(!fmpKey||fmpKey.length<8){err.textContent='Please enter your FMP API key.';err.style.display='block';return;}
    err.style.display='none';
    saveKeys(antKey,finKey,fmpKey);
    document.getElementById('overlay').style.display='none';
    document.getElementById('progress').style.display='block';
    setP(2,'Starting...');
    try{main();}catch(e){document.getElementById('progress').style.display='none';document.getElementById('report').style.display='block';document.getElementById('report').innerHTML='<div class="warn">Error: '+san(e.message)+'</div>';}
  });
  document.getElementById('clearbtn').addEventListener('click',clearKeys);
});

})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Close-of-Market Brief</title>
<style>
  :root {
    --ink: #1a2e1a;
    --cream: #f5f0e8;
    --warm-white: #faf8f4;
    --gold: #9a7d4a;
    --mid: #6b6560;
    --rule: #d4cdc3;
    --up: #2a6e2a;
    --dn: #8b2020;
    --warn: #7a5a00;
    --warn-bg: #fff8e6;
    --add-bg: #eaf4ea;
    --trim-bg: #fdf0f0;
    --hold-bg: #f5f3ee;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--warm-white); color: var(--ink); font-family: 'Georgia', serif; font-size: 15px; line-height: 1.6; }
  header { background: var(--ink); color: var(--cream); padding: 18px 28px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 1.1rem; font-weight: normal; letter-spacing: .04em; }
  #run-date { font-size: .8rem; color: #a0b0a0; font-family: monospace; }

  .setup-panel { max-width: 480px; margin: 48px auto; padding: 32px; background: white; border: 1px solid var(--rule); border-radius: 4px; }
  .setup-panel h2 { font-size: 1rem; font-weight: normal; margin-bottom: 24px; color: var(--ink); }
  label { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--mid); margin-bottom: 6px; margin-top: 16px; }
  input[type="password"], input[type="text"] { width: 100%; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 3px; font-size: .9rem; font-family: monospace; background: var(--warm-white); color: var(--ink); }
  input:focus { outline: 2px solid var(--gold); border-color: var(--gold); }
  .run-btn { margin-top: 24px; width: 100%; padding: 12px; background: var(--ink); color: var(--cream); border: none; border-radius: 3px; font-size: .9rem; letter-spacing: .08em; cursor: pointer; transition: opacity .2s; }
  .run-btn:hover { opacity: .85; }

  #progress-area { display: none; max-width: 480px; margin: 32px auto; padding: 0 32px; }
  .progress-bar-wrap { background: #e8e4dc; border-radius: 20px; height: 6px; margin-bottom: 10px; }
  .progress-bar { height: 6px; background: var(--gold); border-radius: 20px; transition: width .3s; }
  #progress-label { font-size: .82rem; color: var(--mid); }

  #report-area { display: none; max-width: 920px; margin: 0 auto; padding: 28px; }
  .report-header { border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 24px; }
  .report-header h2 { font-size: 1.3rem; font-weight: normal; }
  .report-header p { font-size: .83rem; color: var(--mid); margin-top: 4px; }

  .section { margin-bottom: 28px; }
  .section h3 { font-size: .73rem; text-transform: uppercase; letter-spacing: .12em; color: var(--mid); border-bottom: 1px solid #ddd; padding-bottom: 6px; margin-bottom: 12px; }
  .section ul { list-style: none; }
  .section ul li { padding: 6px 0; border-bottom: 1px solid #f0ede8; font-size: .91rem; line-height: 1.5; }
  .section ul li:last-child { border-bottom: none; }

  .movers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .mover-col h4 { font-size: .73rem; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  .gainers h4 { color: var(--up); }
  .decliners h4 { color: var(--dn); }

  .holdings-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  .holdings-table th { text-align: left; padding: 7px 8px; background: var(--ink); color: var(--cream); font-weight: normal; font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; }
  .holdings-table td { padding: 6px 8px; border-bottom: 1px solid #eee; vertical-align: middle; }
  .holdings-table tr:hover td { background: #f9f8f4; }
  .up { color: var(--up); }
  .dn { color: var(--dn); }
  .na { color: #aaa; font-style: italic; }
  .theme-tag { font-size: .66rem; background: #e8e4dc; padding: 1px 5px; border-radius: 10px; color: #666; white-space: nowrap; }
  .data-gaps { font-size: .82rem; color: #888; font-style: italic; }

  /* RATING BADGES */
  .badge { font-size: .68rem; font-weight: bold; padding: 2px 7px; border-radius: 10px; white-space: nowrap; letter-spacing: .04em; }
  .badge-add  { background: var(--add-bg);  color: var(--up); border: 1px solid #b8ddb8; }
  .badge-trim { background: var(--trim-bg); color: var(--dn); border: 1px solid #ddb8b8; }
  .badge-hold { background: var(--hold-bg); color: var(--mid); border: 1px solid #ccc; }

  /* VOLUME FLAG */
  .vol-high { font-size: .7rem; color: var(--warn); font-weight: bold; }

  .error-box { background: #fff3f3; border: 1px solid #f5c6c6; border-radius: 3px; padding: 14px 18px; color: var(--dn); font-size: .88rem; margin-top: 16px; }
  .error-box strong { display: block; margin-bottom: 4px; }
  .warn-box { background: var(--warn-bg); border: 1px solid #e0c96a; border-radius: 3px; padding: 10px 14px; color: var(--warn); font-size: .83rem; margin-bottom: 16px; }
  .warn-box strong { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
  .re-run { margin-top: 24px; font-size: .85rem; color: var(--ink); cursor: pointer; text-decoration: underline; background: none; border: none; }

  .news-item { padding: 9px 0; border-bottom: 1px solid #f0ede8; font-size: .88rem; line-height: 1.5; }
  .news-item:last-child { border-bottom: none; }
  .news-item a { color: var(--ink); text-decoration: underline; }
  .news-item a:hover { color: var(--gold); }
  .news-meta { font-size: .75rem; color: var(--mid); margin-top: 2px; font-family: monospace; }
  .news-ticker-tag { font-size: .68rem; background: var(--ink); color: var(--cream); padding: 1px 6px; border-radius: 10px; margin-right: 5px; vertical-align: middle; }
</style>
</head>
<body>

<header>
  <h1>Portfolio Close-of-Market Brief</h1>
  <span id="run-date"></span>
</header>

<div id="setup" class="setup-panel">
  <h2>Enter your API keys to generate today's brief</h2>
  <label>Anthropic API Key</label>
  <input type="password" id="anthropic-key" placeholder="sk-ant-..." autocomplete="off">
  <label>Finnhub API Key</label>
  <input type="text" id="finnhub-key" placeholder="your finnhub key" autocomplete="off">
  <div style="margin-top:14px;display:flex;align-items:center;gap:8px;">
    <input type="checkbox" id="remember-keys" style="width:auto;cursor:pointer;">
    <label for="remember-keys" style="margin:0;text-transform:none;font-size:.82rem;letter-spacing:0;color:var(--mid);cursor:pointer;">Remember my keys on this device</label>
  </div>
  <button class="run-btn" id="run-btn" onclick="runAgent()">Generate Brief</button>
  <div id="keys-saved-note" style="display:none;margin-top:10px;font-size:.78rem;color:var(--mid);text-align:center;">
    Keys remembered — <span onclick="clearSavedKeys()" style="cursor:pointer;text-decoration:underline;">clear saved keys</span>
  </div>
</div>

<div id="progress-area">
  <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
  <div id="progress-label">Starting…</div>
</div>

<div id="report-area"></div>

<script>
// ── Key persistence ─────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  try {
    const ak = localStorage.getItem('pb_anthropic_key');
    const fk = localStorage.getItem('pb_finnhub_key');
    if (ak) {
      document.getElementById('anthropic-key').value = ak;
      document.getElementById('finnhub-key').value = fk || '';
      document.getElementById('remember-keys').checked = true;
      document.getElementById('keys-saved-note').style.display = 'block';
    }
  } catch(e) {}
});

function clearSavedKeys() {
  try {
    localStorage.removeItem('pb_anthropic_key');
    localStorage.removeItem('pb_finnhub_key');
    document.getElementById('anthropic-key').value = '';
    document.getElementById('finnhub-key').value = '';
    document.getElementById('remember-keys').checked = false;
    document.getElementById('keys-saved-note').style.display = 'none';
  } catch(e) {}
}

// ── Holdings ────────────────────────────────────────────────────────────────
const HOLDINGS = [
  { ticker: 'NVDA', theme: 'AI/Semi' },
  { ticker: 'TSM',  theme: 'AI/Semi' },
  { ticker: 'ASML', theme: 'AI/Semi' },
  { ticker: 'AVGO', theme: 'AI/Semi' },
  { ticker: 'QCOM', theme: 'AI/Semi' },
  { ticker: 'CSCO', theme: 'AI/Semi' },
  { ticker: 'DELL', theme: 'AI/Semi' },
  { ticker: 'CRWD', theme: 'AI/Semi' },
  { ticker: 'VEEV', theme: 'AI/Semi' },
  { ticker: 'AAPL', theme: 'Platform' },
  { ticker: 'AMZN', theme: 'Platform' },
  { ticker: 'BABA', theme: 'Platform' },
  { ticker: 'WMT',  theme: 'Platform' },
  { ticker: 'DASH', theme: 'Platform' },
  { ticker: 'NKE',  theme: 'Platform' },
  { ticker: 'NYT',  theme: 'Platform' },
  { ticker: 'GE',   theme: 'Industrial' },
  { ticker: 'BA',   theme: 'Industrial' },
  { ticker: 'CAT',  theme: 'Industrial' },
  { ticker: 'DAL',  theme: 'Industrial' },
  { ticker: 'FDX',  theme: 'Industrial' },
  { ticker: 'WAB',  theme: 'Industrial' },
  { ticker: 'XOM',  theme: 'Energy' },
  { ticker: 'CVX',  theme: 'Energy' },
  { ticker: 'COP',  theme: 'Energy' },
  { ticker: 'SO',   theme: 'Energy' },
  { ticker: 'BEP',  theme: 'Energy' },
  { ticker: 'BEPC', theme: 'Energy' },
  { ticker: 'BAC',  theme: 'Financials' },
  { ticker: 'JPM',  theme: 'Financials' },
  { ticker: 'SPGI', theme: 'Financials' },
  { ticker: 'COWZ', theme: 'Financials' },
  { ticker: 'VRTX', theme: 'Health' },
  { ticker: 'JNJ',  theme: 'Health' },
  { ticker: 'PFE',  theme: 'Health' },
  { ticker: 'BMY',  theme: 'Health' },
  { ticker: 'VTRS', theme: 'Health' },
  { ticker: 'PKX',  theme: 'Materials' },
];

// ── Helpers ─────────────────────────────────────────────────────────────────
function setProgress(pct, label) {
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent = label;
}

async function fetchWithTimeout(url, opts = {}, timeoutMs = 8000, retries = 2) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, { ...opts, signal: controller.signal });
      clearTimeout(timer);
      return res;
    } catch (err) {
      clearTimeout(timer);
      const isNetwork = err.name === 'TypeError' || err.name === 'AbortError' ||
                        (err.message && err.message.includes('NetworkError'));
      if (isNetwork && attempt < retries) {
        await new Promise(r => setTimeout(r, 600 * (attempt + 1)));
        continue;
      }
      throw err;
    }
  }
}

// ── Finnhub fetch functions ─────────────────────────────────────────────────
async function fetchQuote(ticker, key) {
  try {
    const res = await fetchWithTimeout(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${key}`, {}, 8000, 2);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const d = await res.json();
    if (!d.c || d.c === 0) return null;
    return { price: d.c, change: d.d, pct: d.dp, high: d.h, low: d.l, prevClose: d.pc, volume: d.v };
  } catch (err) { return { error: err.message || 'NetworkError' }; }
}

async function fetchBasicFinancials(ticker, key) {
  try {
    const res = await fetchWithTimeout(`https://finnhub.io/api/v1/stock/metric?symbol=${ticker}&metric=all&token=${key}`, {}, 8000, 1);
    if (!res.ok) return null;
    const d = await res.json();
    const m = d.metric || {};
    return {
      pe:            m['peNormalizedAnnual']   || m['peTTM'] || null,
      forwardPE:     m['forwardPE']            || null,
      revenueGrowth: m['revenueGrowthTTMYoy']  || null,
      epsGrowth:     m['epsGrowthTTMYoy']      || null,
      netMargin:     m['netProfitMarginTTM']   || null,
      roe:           m['roeTTM']               || null,
      week52High:    m['52WeekHigh']           || null,
      week52Low:     m['52WeekLow']            || null,
      avgVol10d:     m['10DayAverageTradingVolume'] || null,
      avgVol90d:     m['3MonthAverageTradingVolume'] || null,
      beta:          m['beta']                 || null,
    };
  } catch { return null; }
}

async function fetchInsider(ticker, key) {
  try {
    const to   = new Date();
    const from = new Date(); from.setDate(from.getDate() - 30);
    const fmt  = d => d.toISOString().split('T')[0];
    const res  = await fetchWithTimeout(`https://finnhub.io/api/v1/stock/insider-transactions?symbol=${ticker}&from=${fmt(from)}&to=${fmt(to)}&token=${key}`, {}, 8000, 1);
    if (!res.ok) return null;
    const d = await res.json();
    const txns = (d.data || []).filter(t => t.transactionType === 'P-Purchase' || t.transactionType === 'S-Sale');
    if (!txns.length) return null;
    const buys  = txns.filter(t => t.transactionType === 'P-Purchase');
    const sells = txns.filter(t => t.transactionType === 'S-Sale');
    return { buys: buys.length, sells: sells.length, net: buys.length - sells.length };
  } catch { return null; }
}

async function fetchEarnings(ticker, key) {
  try {
    const from = new Date();
    const to   = new Date(); to.setDate(to.getDate() + 90);
    const fmt  = d => d.toISOString().split('T')[0];
    const res  = await fetchWithTimeout(`https://finnhub.io/api/v1/calendar/earnings?from=${fmt(from)}&to=${fmt(to)}&symbol=${ticker}&token=${key}`, {}, 8000, 1);
    if (!res.ok) return null;
    const d = await res.json();
    return d.earningsCalendar?.[0] || null;
  } catch { return null; }
}

async function fetchNews(ticker, key) {
  try {
    const from = new Date(); from.setDate(from.getDate() - 1);
    const to   = new Date();
    const fmt  = d => d.toISOString().split('T')[0];
    const res  = await fetchWithTimeout(`https://finnhub.io/api/v1/company-news?symbol=${ticker}&from=${fmt(from)}&to=${fmt(to)}&token=${key}`, {}, 8000, 1);
    if (!res.ok) return [];
    const items = await res.json();
    return (items || []).slice(0, 2).map(n => ({ ticker, headline: n.headline, url: n.url, source: n.source, datetime: n.datetime }));
  } catch { return []; }
}

async function fetchRecommendation(ticker, key) {
  try {
    const res = await fetchWithTimeout(`https://finnhub.io/api/v1/stock/recommendation?symbol=${ticker}&token=${key}`, {}, 8000, 1);
    if (!res.ok) return null;
    const data = await res.json();
    return data?.[0] || null;
  } catch { return null; }
}

async function fetchPriceTarget(ticker, key) {
  try {
    const res = await fetchWithTimeout(`https://finnhub.io/api/v1/stock/price-target?symbol=${ticker}&token=${key}`, {}, 8000, 1);
    if (!res.ok) return null;
    const data = await res.json();
    if (!data?.targetMean) return null;
    return { low: data.targetLow, high: data.targetHigh, mean: data.targetMean };
  } catch { return null; }
}

// ── Main agent ──────────────────────────────────────────────────────────────
async function runAgent() {
  const anthropicKey = document.getElementById('anthropic-key').value.trim();
  const finnhubKey   = document.getElementById('finnhub-key').value.trim();

  if (!anthropicKey || !finnhubKey) { alert('Please enter both API keys.'); return; }

  try {
    if (document.getElementById('remember-keys').checked) {
      localStorage.setItem('pb_anthropic_key', anthropicKey);
      localStorage.setItem('pb_finnhub_key', finnhubKey);
    } else {
      localStorage.removeItem('pb_anthropic_key');
      localStorage.removeItem('pb_finnhub_key');
    }
  } catch(e) {}

  document.getElementById('setup').style.display = 'none';
  document.getElementById('progress-area').style.display = 'block';
  document.getElementById('run-date').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  const quoteData      = [];
  const networkFailures = [];
  const noData         = [];
  const fundamentals   = {};
  const insiderMap     = {};
  const earningsMap    = {};
  const recMap         = {};
  const ptMap          = {};

  // ── 1. Quotes ──────────────────────────────────────────────────────────
  for (let i = 0; i < HOLDINGS.length; i++) {
    const { ticker, theme } = HOLDINGS[i];
    setProgress(Math.round((i / HOLDINGS.length) * 30), `Quotes: ${ticker} (${i+1}/${HOLDINGS.length})…`);
    const q = await fetchQuote(ticker, finnhubKey);
    if (!q)        { noData.push(ticker); quoteData.push({ ticker, theme, error: 'no data' }); }
    else if (q.error) { networkFailures.push(`${ticker}: ${q.error}`); quoteData.push({ ticker, theme, error: q.error }); }
    else           { quoteData.push({ ticker, theme, ...q }); }
    await new Promise(r => setTimeout(r, 1050));
  }

  // ── 2. Basic financials ────────────────────────────────────────────────
  for (let i = 0; i < HOLDINGS.length; i++) {
    const { ticker } = HOLDINGS[i];
    setProgress(30 + Math.round((i / HOLDINGS.length) * 20), `Fundamentals: ${ticker}…`);
    const f = await fetchBasicFinancials(ticker, finnhubKey);
    if (f) fundamentals[ticker] = f;
    await new Promise(r => setTimeout(r, 1050));
  }

  // ── 3. Insider transactions ────────────────────────────────────────────
  for (let i = 0; i < HOLDINGS.length; i++) {
    const { ticker } = HOLDINGS[i];
    if (i % 5 === 0) setProgress(50 + Math.round((i / HOLDINGS.length) * 8), `Insider data: ${ticker}…`);
    const ins = await fetchInsider(ticker, finnhubKey);
    if (ins) insiderMap[ticker] = ins;
    await new Promise(r => setTimeout(r, 1050));
  }

  // ── 4. Earnings calendar ───────────────────────────────────────────────
  setProgress(58, 'Fetching earnings calendar…');
  for (const { ticker } of HOLDINGS) {
    const e = await fetchEarnings(ticker, finnhubKey);
    if (e) earningsMap[ticker] = e.date;
    await new Promise(r => setTimeout(r, 400));
  }

  // ── 5. News ────────────────────────────────────────────────────────────
  setProgress(62, 'Fetching news…');
  const allNews = [];
  for (const { ticker } of HOLDINGS) {
    const items = await fetchNews(ticker, finnhubKey);
    allNews.push(...items);
    await new Promise(r => setTimeout(r, 300));
  }
  const seenHeadlines = new Set();
  const newsDigest = allNews
    .sort((a, b) => b.datetime - a.datetime)
    .filter(n => { if (seenHeadlines.has(n.headline)) return false; seenHeadlines.add(n.headline); return true; })
    .slice(0, 20);

  // ── 6. Recommendations & price targets ────────────────────────────────
  setProgress(68, 'Fetching analyst data…');
  for (const { ticker } of HOLDINGS) {
    const [rec, pt] = await Promise.allSettled([fetchRecommendation(ticker, finnhubKey), fetchPriceTarget(ticker, finnhubKey)]);
    if (rec.status === 'fulfilled' && rec.value) recMap[ticker] = rec.value;
    if (pt.status  === 'fulfilled' && pt.value)  ptMap[ticker]  = pt.value;
    await new Promise(r => setTimeout(r, 500));
  }

  // ── 7. Compute movers & volume flags ──────────────────────────────────
  setProgress(78, 'Computing movers…');
  const valid    = quoteData.filter(q => q.pct != null);
  const sorted   = [...valid].sort((a, b) => b.pct - a.pct);
  const gainers  = sorted.slice(0, 5);
  const decliners = sorted.slice(-5).reverse();

  // Flag unusual volume: today's volume > 1.5x 10-day average
  const volumeFlags = {};
  for (const q of valid) {
    const f = fundamentals[q.ticker];
    if (f && f.avgVol10d && q.volume) {
      const ratio = q.volume / (f.avgVol10d * 1e6);
      if (ratio > 1.5) volumeFlags[q.ticker] = ratio.toFixed(1);
    }
  }

  // ── 8. Build prompt ────────────────────────────────────────────────────
  setProgress(82, 'Building prompt…');

  const holdingsSummary = quoteData
    .filter(q => q.price != null)
    .map(q => {
      const f   = fundamentals[q.ticker] || {};
      const pt  = ptMap[q.ticker];
      const ins = insiderMap[q.ticker];
      const w52 = f.week52High ? ` | 52wk: $${f.week52Low?.toFixed(0)}–$${f.week52High?.toFixed(0)}` : '';
      const pe  = f.pe   ? ` | P/E: ${f.pe.toFixed(1)}` : '';
      const fpe = f.forwardPE ? ` fwdP/E: ${f.forwardPE.toFixed(1)}` : '';
      const rev = f.revenueGrowth != null ? ` | RevGrowth: ${(f.revenueGrowth*100).toFixed(1)}%` : '';
      const mg  = f.netMargin    != null ? ` | Margin: ${(f.netMargin*100).toFixed(1)}%` : '';
      const roe = f.roe          != null ? ` | ROE: ${(f.roe*100).toFixed(1)}%` : '';
      const beta= f.beta         != null ? ` | Beta: ${f.beta.toFixed(2)}` : '';
      const ptStr = pt ? ` | PT mean: $${pt.mean?.toFixed(0)} ($${pt.low?.toFixed(0)}–$${pt.high?.toFixed(0)})` : '';
      const insStr = ins ? ` | Insider 30d: ${ins.buys}B/${ins.sells}S` : '';
      const volStr = volumeFlags[q.ticker] ? ` | ⚠ Vol ${volumeFlags[q.ticker]}x avg` : '';
      return `${q.ticker} (${q.theme}): $${q.price.toFixed(2)} ${q.pct >= 0 ? '+' : ''}${q.pct?.toFixed(2)}%${w52}${pe}${fpe}${rev}${mg}${roe}${beta}${ptStr}${insStr}${volStr}`;
    }).join('\n');

  const analystSummary = Object.entries(recMap).map(([t, r]) =>
    `${t}: StrongBuy=${r.strongBuy} Buy=${r.buy} Hold=${r.hold} Sell=${r.sell} StrongSell=${r.strongSell}`
  ).join('\n') || 'none available';

  const earningsList = Object.entries(earningsMap).map(([t, d]) => `${t}: ${d}`).join(', ') || 'none found';
  const newsSummary  = newsDigest.slice(0, 10).map(n => `[${n.ticker}] ${n.headline}`).join('\n') || 'none today';

  const prompt = `You are a senior portfolio analyst writing a daily close-of-market brief for a sophisticated investor. Write a detailed, editorial-quality narrative of 7–9 substantial paragraphs — do not truncate or cut off mid-sentence. Separate each paragraph with ---.

Cover in flowing prose: (1) overall portfolio tone and breadth, (2) most consequential movers with analysis of likely causes, referencing fundamentals (P/E, growth, margins, ROE) where relevant, (3) unusual volume flags and what they may signal, (4) insider buying/selling activity and its significance, (5) analyst consensus, upgrades/downgrades and price target levels vs current price, (6) thematic observations by sector, (7) significant news including product launches, regulatory decisions, earnings surprises, (8) upcoming earnings dates and their strategic importance, (9) a Hold / Add / Trim assessment for each position followed by a forward-looking note.

For the Hold/Add/Trim assessments: Add = strong fundamentals + attractive valuation + positive momentum or catalyst. Trim = deteriorating fundamentals, stretched valuation, or negative catalyst. Hold = everything else. Be specific and justify each call briefly.

Holdings data (price, fundamentals, price targets, insider activity, volume flags):
${holdingsSummary}

Analyst consensus:
${analystSummary}

Today's news:
${newsSummary}

Upcoming earnings: ${earningsList}

${networkFailures.length ? `Data unavailable for: ${networkFailures.map(f => f.split(':')[0]).join(', ')}` : ''}

Write the complete brief now. Do not stop until all paragraphs including all Hold/Add/Trim assessments are finished.`;

  // ── 9. Render static sections, then stream brief ───────────────────────
  setProgress(100, 'Generating AI brief…');
  const ra = document.getElementById('report-area');
  ra.style.display = 'block';
  document.getElementById('progress-area').style.display = 'none';

  const fmt  = (n, dec=2) => n == null ? '<span class="na">n/a</span>' : `<span class="${n>=0?'up':'dn'}">${n>=0?'+':''}${n.toFixed(dec)}%</span>`;
  const fmtP = n => n == null ? '<span class="na">n/a</span>' : `$${n.toFixed(2)}`;
  const fmtN = (n, dec=1, suffix='') => n == null ? '<span class="na">n/a</span>' : `${n.toFixed(dec)}${suffix}`;

  const networkWarn = networkFailures.length
    ? `<div class="warn-box"><strong>⚠ Network issues</strong> Data unavailable for: ${networkFailures.map(f=>f.split(':')[0]).join(', ')}. Run again to retry.</div>` : '';

  const newsHTML = newsDigest.length ? `
    <div class="section">
      <h3>Today's News &amp; Events</h3>
      ${newsDigest.map(n => {
        const t = new Date(n.datetime * 1000);
        const timeStr = t.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        return `<div class="news-item"><span class="news-ticker-tag">${n.ticker}</span><a href="${n.url}" target="_blank" rel="noopener">${n.headline}</a><div class="news-meta">${n.source} · ${timeStr}</div></div>`;
      }).join('')}
    </div>` : '';

  const holdingsTableHTML = `
    <div class="section">
      <h3>All Holdings</h3>
      <table class="holdings-table">
        <thead><tr>
          <th>Ticker</th><th>Theme</th><th>Price</th><th>Chg%</th>
          <th>P/E</th><th>Fwd P/E</th><th>Rev Gr%</th><th>Margin%</th><th>ROE%</th><th>Beta</th>
          <th>52w Low</th><th>52w High</th><th>PT Mean</th><th>Insider 30d</th><th>Vol Flag</th><th>Rating</th>
        </tr></thead>
        <tbody id="holdings-tbody">
          ${quoteData.map(q => {
            const f   = fundamentals[q.ticker] || {};
            const pt  = ptMap[q.ticker];
            const ins = insiderMap[q.ticker];
            const vf  = volumeFlags[q.ticker];
            if (q.error) {
              return `<tr><td><strong>${q.ticker}</strong></td><td><span class="theme-tag">${q.theme}</span></td><td colspan="14" class="na" style="font-size:.78rem">⚠ ${q.error === 'no data' ? 'No market data' : 'Fetch error'}</td></tr>`;
            }
            const insStr = ins ? `${ins.buys}B / ${ins.sells}S` : '<span class="na">—</span>';
            const insColor = ins ? (ins.net > 0 ? 'color:var(--up)' : ins.net < 0 ? 'color:var(--dn)' : '') : '';
            return `<tr>
              <td><strong>${q.ticker}</strong></td>
              <td><span class="theme-tag">${q.theme}</span></td>
              <td>${fmtP(q.price)}</td>
              <td>${fmt(q.pct)}</td>
              <td>${f.pe != null ? f.pe.toFixed(1) : '<span class="na">—</span>'}</td>
              <td>${f.forwardPE != null ? f.forwardPE.toFixed(1) : '<span class="na">—</span>'}</td>
              <td>${f.revenueGrowth != null ? fmtN(f.revenueGrowth*100) : '<span class="na">—</span>'}</td>
              <td>${f.netMargin != null ? fmtN(f.netMargin*100) : '<span class="na">—</span>'}</td>
              <td>${f.roe != null ? fmtN(f.roe*100) : '<span class="na">—</span>'}</td>
              <td>${f.beta != null ? f.beta.toFixed(2) : '<span class="na">—</span>'}</td>
              <td>${f.week52Low  != null ? '$'+f.week52Low.toFixed(0)  : '<span class="na">—</span>'}</td>
              <td>${f.week52High != null ? '$'+f.week52High.toFixed(0) : '<span class="na">—</span>'}</td>
              <td>${pt ? '$'+pt.mean.toFixed(0) : '<span class="na">—</span>'}</td>
              <td style="${insColor}">${insStr}</td>
              <td>${vf ? `<span class="vol-high">⚑ ${vf}x</span>` : '<span class="na">—</span>'}</td>
              <td id="rating-${q.ticker}"><span class="na">…</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    ${(noData.length || networkFailures.length) ? `<div class="section"><p class="data-gaps">${noData.length ? 'No data: '+noData.join(', ')+'. ' : ''}${networkFailures.length ? 'Errors: '+networkFailures.join(' · ') : ''}</p></div>` : ''}
    <button class="re-run" onclick="location.reload()">↺ Run again</button>`;

  ra.innerHTML = `
    <div class="report-header">
      <h2>Close-of-Market Brief</h2>
      <p>${new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
    </div>
    ${networkWarn}
    ${newsHTML}
    <div class="section">
      <h3>Top Movers</h3>
      <div class="movers-grid">
        <div class="mover-col gainers"><h4>Gainers</h4>
          ${gainers.map(g => `<div style="margin-bottom:6px;font-size:.88rem"><strong>${g.ticker}</strong> ${fmtP(g.price)} ${fmt(g.pct)}</div>`).join('')}
        </div>
        <div class="mover-col decliners"><h4>Decliners</h4>
          ${decliners.map(d => `<div style="margin-bottom:6px;font-size:.88rem"><strong>${d.ticker}</strong> ${fmtP(d.price)} ${fmt(d.pct)}</div>`).join('')}
        </div>
      </div>
    </div>
    ${Object.keys(earningsMap).length ? `<div class="section"><h3>Upcoming Earnings (90 days)</h3><ul>${Object.entries(earningsMap).map(([t,d])=>`<li><strong>${t}</strong> — ${d}</li>`).join('')}</ul></div>` : ''}
    <div class="section" id="brief-section">
      <h3>AI Brief</h3>
      <div id="brief-stream" style="font-size:.93rem;line-height:1.85;color:#888;font-style:italic;">Generating narrative…</div>
    </div>
    ${holdingsTableHTML}
  `;

  // ── Stream Claude brief ────────────────────────────────────────────────
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': anthropicKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 4000,
        stream: true,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(`Claude API error ${res.status}: ${err.error?.message || res.statusText}`);
    }

    const briefEl = document.getElementById('brief-stream');
    briefEl.style.color = '';
    briefEl.style.fontStyle = '';
    briefEl.textContent = '';

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') break;
        try {
          const evt = JSON.parse(data);
          if (evt.type === 'content_block_delta' && evt.delta?.type === 'text_delta') {
            fullText += evt.delta.text;
            briefEl.innerHTML = fullText
              .split(/\n?---\n?/)
              .map(p => p.trim()).filter(Boolean)
              .map(p => `<p style="margin-bottom:1.2em;">${p.replace(/\n/g, '<br>')}</p>`)
              .join('<hr style="border:none;border-top:1px solid #ddd;margin:1.2em 0;">');
          }
        } catch { /* skip malformed SSE lines */ }
      }
    }

    // ── Parse Hold/Add/Trim ratings from brief and update table badges ──
    const ratingRegex = /\b(NVDA|TSM|ASML|AVGO|QCOM|CSCO|DELL|CRWD|VEEV|AAPL|AMZN|BABA|WMT|DASH|NKE|NYT|GE|BA|CAT|DAL|FDX|WAB|XOM|CVX|COP|SO|BEP|BEPC|BAC|JPM|SPGI|COWZ|VRTX|JNJ|PFE|BMY|VTRS|PKX)\b[^.]{0,60}?\b(Add|Trim|Hold)\b/gi;
    let match;
    while ((match = ratingRegex.exec(fullText)) !== null) {
      const ticker = match[1].toUpperCase();
      const rating = match[2].charAt(0).toUpperCase() + match[2].slice(1).toLowerCase();
      const el = document.getElementById(`rating-${ticker}`);
      if (el) {
        const cls = rating === 'Add' ? 'badge-add' : rating === 'Trim' ? 'badge-trim' : 'badge-hold';
        el.innerHTML = `<span class="badge ${cls}">${rating}</span>`;
      }
    }

  } catch (err) {
    const briefEl = document.getElementById('brief-stream');
    if (briefEl) briefEl.innerHTML = `<div class="error-box"><strong>AI Brief unavailable</strong> ${err.message}</div>`;
  }
}
</script>
</body>
</html>

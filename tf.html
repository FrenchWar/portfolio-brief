// ── STORAGE HELPERS ────────────────────────────

function sget(k) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } }
function sset(k,v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

function loadKeys() {
  var s = sget(KEYS_KEY);
  if (s && s.ant) { document.getElementById('ant-key').value = s.ant; document.getElementById('ant-saved').style.display='inline'; }
  if (s && s.fin) { document.getElementById('fin-key').value = s.fin; document.getElementById('fin-saved').style.display='inline'; }
}
function saveKeys() { sset(KEYS_KEY, {ant: antKey, fin: finKey}); }
function clearKeys() {
  sset(KEYS_KEY, null);
  document.getElementById('ant-key').value = '';
  document.getElementById('fin-key').value = '';
  document.getElementById('ant-saved').style.display='none';
  document.getElementById('fin-saved').style.display='none';
}

function loadShares() { return sget(SHARES_KEY) || {}; }
function saveShare(tk, val) {
  var s = loadShares(); var n = parseFloat(val);
  if (!isNaN(n) && n > 0) s[tk] = n; else delete s[tk];
  sset(SHARES_KEY, s);
}
function loadNotes() { return sget(NOTES_KEY) || {}; }
function saveNote(tk, val) {
  var n = loadNotes();
  if (val && val.trim()) n[tk] = val.trim(); else delete n[tk];
  sset(NOTES_KEY, n);
}
function loadWL() { var w = sget(WL_KEY); return (w && w.length) ? w : DEFAULT_WATCHLIST.slice(); }
function saveWL(list) { sset(WL_KEY, list); }
function loadWLNotes() { return sget(WLN_KEY) || {}; }
function saveWLNote(tk, val) {
  var n = loadWLNotes();
  if (val && val.trim()) n[tk] = val.trim(); else delete n[tk];
  sset(WLN_KEY, n);
}
function loadArch() { return sget(ARCH_KEY) || []; }
function saveArch(entry) {
  var list = loadArch(); list.unshift(entry);
  if (list.length > 30) list.length = 30;
  sset(ARCH_KEY, list);
}

// ── UTILS ──────────────────────────────────────

function setP(pct, label) {
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('plabel').textContent = label;
}
function sleep(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }
function san(str) {
  if (!str) return '';
  var s = String(str);
  var result = '';
  var map = {};
  map[String.fromCharCode(8212)] = '-';
  map[String.fromCharCode(8211)] = '-';
  map[String.fromCharCode(8216)] = "'";
  map[String.fromCharCode(8217)] = "'";
  map[String.fromCharCode(8220)] = '"';
  map[String.fromCharCode(8221)] = '"';
  map[String.fromCharCode(8230)] = '...';
  for (var i = 0; i < s.length; i++) {
    var ch = s[i];
    if (s.charCodeAt(i) > 127) {
      result += map[ch] !== undefined ? map[ch] : '';
    } else {
      result += ch;
    }
  }
  return result;
}
function replaceAll(str, find, repl) {
  var result = '';
  var idx = str.indexOf(find);
  while (idx !== -1) {
    result += str.slice(0, idx) + repl;
    str = str.slice(idx + find.length);
    idx = str.indexOf(find);
  }
  return result + str;
}
function splitParagraphs(str) {
  var parts = [], current = '', i = 0;
  var n10 = String.fromCharCode(10), n13 = String.fromCharCode(13);
  while (i < str.length) {
    if (str[i] === '-' && str[i+1] === '-' && str[i+2] === '-') {
      if (current.trim()) parts.push(current.trim());
      current = '';
      i += 3;
      while (i < str.length && (str[i] === n10 || str[i] === n13)) i++;
    } else {
      current += str[i];
      i++;
    }
  }
  if (current.trim()) parts.push(current.trim());
  return parts;
}
function replaceNewlines(str) {
  return str.split(String.fromCharCode(10)).join('<br>');
}
function escapeQuotes(str) {
  return replaceAll(String(str), '"', '&quot;');
}

function fmtP(n) { return n != null ? '$'+n.toFixed(2) : '<span class="na">n/a</span>'; }
function fmtPct(n) {
  if (n == null) return '<span class="na">n/a</span>';
  return '<span class="'+(n>=0?'up':'dn')+'">'+(n>=0?'+':'')+n.toFixed(2)+'%</span>';
}
function fmtChg(n) {
  if (n == null) return '<span class="na">n/a</span>';
  return '<span class="'+(n>=0?'up':'dn')+'">'+(n>=0?'+':'-')+'$'+Math.abs(n).toFixed(2)+'</span>';
}

// ── FINNHUB ────────────────────────────────────

function fhub(path, retries) {
  retries = retries || 0;
  return fetch('https://finnhub.io/api/v1' + path + '&token=' + finKey)
    .then(function(r) {
      if (r.status === 429 && retries < 2) return sleep(5000).then(function(){ return fhub(path, retries+1); });
      if (!r.ok) throw new Error('Finnhub ' + r.status);
      return r.json();
    });
}

// ── TECHNICAL INDICATORS ───────────────────────

function calcSMA(arr, n) {
  if (!arr || arr.length < n) return null;
  var s = 0; for (var i = arr.length-n; i < arr.length; i++) s += arr[i];
  return s / n;
}
function calcEMA(arr, n) {
  if (!arr || arr.length < n) return null;
  var k = 2/(n+1), ema = 0;
  for (var i = 0; i < n; i++) ema += arr[i];
  ema /= n;
  for (var j = n; j < arr.length; j++) ema = arr[j]*k + ema*(1-k);
  return ema;
}
function calcRSI(arr, n) {
  if (!arr || arr.length < n+1) return null;
  var sl = arr.slice(-(n+1)), g = 0, l = 0;
  for (var i = 1; i < sl.length; i++) {
    var d = sl[i]-sl[i-1];
    if (d >= 0) g += d; else l -= d;
  }
  var ag = g/n, al = l/n;
  return al === 0 ? 100 : 100-(100/(1+ag/al));
}
function calcMACD(arr) {
  if (!arr || arr.length < 35) return null;
  var e12 = calcEMA(arr, 12), e26 = calcEMA(arr, 26);
  if (e12 == null || e26 == null) return null;
  var ml = e12-e26, ms = [];
  for (var i = arr.length-9; i < arr.length; i++) {
    var em12 = calcEMA(arr.slice(0,i+1),12), em26 = calcEMA(arr.slice(0,i+1),26);
    if (em12 != null && em26 != null) ms.push(em12-em26);
  }
  var sig = ms.length >= 3 ? ms.reduce(function(a,b){return a+b;},0)/ms.length : null;
  return {macd:ml, signal:sig, hist: sig!=null ? ml-sig : null};
}
function calcBoll(arr) {
  if (!arr || arr.length < 20) return null;
  var sl = arr.slice(-20), mean = sl.reduce(function(a,b){return a+b;},0)/20;
  var vr = sl.reduce(function(a,b){return a+Math.pow(b-mean,2);},0)/20;
  var sd = Math.sqrt(vr), up = mean+2*sd, lo = mean-2*sd;
  var pr = arr[arr.length-1];
  var pct = sd > 0 ? (pr-lo)/(up-lo)*100 : 50;
  return {upper:up, lower:lo, pct:pct};
}
function calcATR(h,l,c,n) {
  n = n||14;
  if (!h || h.length < n+1) return null;
  var trs = [];
  for (var i = 1; i < h.length; i++)
    trs.push(Math.max(h[i]-l[i], Math.abs(h[i]-c[i-1]), Math.abs(l[i]-c[i-1])));
  var sl = trs.slice(-n);
  return sl.reduce(function(a,b){return a+b;},0)/n;
}
function techSignal(sma20, sma50, rsi, price, macd, boll) {
  if (!sma20||!sma50||!rsi||!price) return 'N/A';
  var sc = 0;
  if (price>sma20) sc++; if (price>sma50) sc++; if (sma20>sma50) sc++;
  if (rsi>50) sc++; if (rsi<30) sc--; if (rsi>75) sc--;
  if (macd && macd.hist != null) { if (macd.hist>0) sc++; else sc--; }
  if (boll && boll.pct != null) { if (boll.pct>80) sc--; if (boll.pct<20) sc++; }
  if (sc>=5) return 'STRONG BUY';
  if (sc>=3) return 'BUY';
  if (sc<=-1) return 'SELL';
  if (sc<=1) return 'WEAK';
  return 'HOLD';
}

  var row = document.getElementById('wlrow-'+tk);
  if (row) row.parentNode.removeChild(row);

// ── MAIN ───────────────────────────────────────

function startBrief() {
  antKey = document.getElementById('ant-key').value.trim();
  finKey = document.getElementById('fin-key').value.trim();
  qMode  = document.getElementById('mode-sel').value === 'quick';

  var err = document.getElementById('errmsg');
  if (!antKey || antKey.indexOf('sk-ant') !== 0) {
    err.textContent = 'Please enter a valid Anthropic API key (starts with sk-ant-).';
    err.style.display = 'block'; return;
  }
  if (!finKey) {
    err.textContent = 'Please enter your Finnhub API key.';
    err.style.display = 'block'; return;
  }
  err.style.display = 'none';
  saveKeys();

  document.getElementById('overlay').style.display  = 'none';
  document.getElementById('progress').style.display = 'block';
  setP(2, 'Fetching quotes...');

  var holdings = qMode
    ? ALL_HOLDINGS.filter(function(h){ return h.th==='Benchmark'; })
        .concat(ALL_HOLDINGS.filter(function(h){ return h.th!=='Benchmark'; }).slice(0,15))
    : ALL_HOLDINGS;

  var qdata = [], fails = [];

  // Batch quote fetch
  function fetchBatch(batch) {
    return Promise.allSettled(
      batch.map(function(h){ return fhub('/quote?symbol='+h.t); })
    ).then(function(results) {
      results.forEach(function(res, i) {
        var h = batch[i];
        if (res.status === 'fulfilled') {
          var q = res.value;
          qdata.push({t:h.t,th:h.th,price:q.c||null,change:q.d||null,pct:q.dp||null,high:q.h||null,low:q.l||null});
        } else {
          fails.push(h.t);
          qdata.push({t:h.t,th:h.th,price:null,change:null,pct:null,high:null,low:null});
        }
      });
    });
  }

  var batchSize = 5;
  var p = Promise.resolve();
  for (var bi = 0; bi < holdings.length; bi += batchSize) {
    (function(batch, idx) {
      p = p.then(function() {
        setP(2+Math.round(idx/holdings.length*20), 'Quotes batch '+(Math.floor(idx/batchSize)+1));
        return fetchBatch(batch);
      }).then(function() {
        if (idx + batchSize < holdings.length) return sleep(6000);
      });
    })(holdings.slice(bi, bi+batchSize), bi);
  }

  p.then(function() { return runRest(); }).catch(function(e) {
    document.getElementById('progress').style.display = 'none';
    document.getElementById('report').style.display = 'block';
    document.getElementById('report').innerHTML = '<div class="warn">Error: '+e.message+'</div>';
  });
}

function runRest() {
  var rangeMap = {}, targetMap = {}, techMap = {}, epsMap = {}, newsDigest = [], analystMap = {}, earningsMap = {};
  var nonBench = ALL_HOLDINGS.filter(function(h){ return h.th!=='Benchmark'&&h.th!=='ETF'; });

  setP(24, 'Fetching 52-week ranges...');

  // Sequential fetches
  var seq = Promise.resolve();

  // 52w ranges + price targets
  nonBench.forEach(function(h) {
    seq = seq.then(function() {
      return fhub('/stock/metric?symbol='+h.t+'&metric=all').then(function(r) {
        var m = r.metric||{};
        rangeMap[h.t] = {hi52:m['52WeekHigh']||null, lo52:m['52WeekLow']||null};
      }).catch(function(){});
    }).then(function() { return sleep(1500); })
    .then(function() {
      return fhub('/stock/price-target?symbol='+h.t).then(function(r) {
        if (r && r.targetMean) targetMap[h.t] = {mean:r.targetMean};
      }).catch(function(){});
    }).then(function() { return sleep(1500); });
  });

  // Candle data - top 10 by value
  seq = seq.then(function() {
    setP(44, 'Computing portfolio weights...');
    var sh = loadShares();
    var ranked = qdata
      .filter(function(q){ return q.th!=='Benchmark'&&q.th!=='ETF'&&q.price!=null; })
      .map(function(q){ return {t:q.t, val:(sh[q.t]||0)*(q.price||0)}; })
      .sort(function(a,b){ return b.val-a.val; });
    var techTks = ranked.filter(function(x){ return x.val>0; }).slice(0,10).map(function(x){ return x.t; });
    if (techTks.length < 3) {
      techTks = qdata.filter(function(q){ return q.th!=='Benchmark'&&q.th!=='ETF'&&q.price!=null; })
        .sort(function(a,b){ return Math.abs(b.pct||0)-Math.abs(a.pct||0); })
        .slice(0,10).map(function(q){ return q.t; });
    }
    var allTechTks = ['SPY'].concat(techTks);
    var toTs = Math.floor(Date.now()/1000), fromTs = toTs - 200*24*3600;
    var tp = Promise.resolve();
    allTechTks.forEach(function(tk, i) {
      tp = tp.then(function() {
        setP(44+Math.round(i/allTechTks.length*14), 'Technical '+(i+1)+'/'+allTechTks.length+': '+tk);
        return fhub('/stock/candle?symbol='+tk+'&resolution=D&from='+fromTs+'&to='+toTs).then(function(c) {
          if (c && c.s==='ok' && c.c && c.c.length>20) {
            var cl=c.c,hi=c.h,lo=c.l,vo=c.v,pr=cl[cl.length-1];
            var sma20=calcSMA(cl,20), sma50=calcSMA(cl,Math.min(50,cl.length-1));
            var rsi=calcRSI(cl,14), macd=calcMACD(cl), boll=calcBoll(cl);
            var atr=calcATR(hi,lo,cl,14);
            var sig=techSignal(sma20,sma50,rsi,pr,macd,boll);
            var trend='Neutral';
            if (sma20&&sma50) {
              if (pr>sma20&&sma20>sma50) trend='Uptrend';
              else if (pr<sma20&&sma20<sma50) trend='Downtrend';
              else if (pr>sma50) trend='Above 50d';
              else trend='Below 50d';
            }
            var r30=cl.length>=31?(cl[cl.length-1]-cl[cl.length-31])/cl[cl.length-31]*100:null;
            var r90=cl.length>=91?(cl[cl.length-1]-cl[cl.length-91])/cl[cl.length-91]*100:null;
            var vr=vo&&vo.length>=20?vo[vo.length-1]/(vo.slice(-20).reduce(function(a,b){return a+b;},0)/20):null;
            techMap[tk]={sma20:sma20,sma50:sma50,rsi:rsi,macd:macd,boll:boll,atr:atr,sig:sig,trend:trend,r30:r30,r90:r90,vr:vr};
          }
        }).catch(function(){});
      }).then(function(){ return sleep(1500); });
    });
    return tp;
  });

  // RS vs SPY
  seq = seq.then(function() {
    var spy = techMap['SPY'];
    Object.keys(techMap).forEach(function(tk) {
      if (tk==='SPY') return;
      var v = techMap[tk];
      v.a30 = (v.r30!=null&&spy&&spy.r30!=null) ? v.r30-spy.r30 : null;
      v.a90 = (v.r90!=null&&spy&&spy.r90!=null) ? v.r90-spy.r90 : null;
    });
  });

  // EPS
  seq = seq.then(function() {
    setP(60, 'Fetching earnings data...');
    var epsTks = Object.keys(techMap).filter(function(t){ return t!=='SPY'; }).slice(0,8);
    var ep = Promise.resolve();
    epsTks.forEach(function(tk) {
      ep = ep.then(function() {
        return fhub('/stock/earnings?symbol='+tk+'&limit=1').then(function(e) {
          if (e&&e.length>0) epsMap[tk]={date:e[0].period,actual:e[0].actual,est:e[0].estimate,surpPct:e[0].surprisePercent};
        }).catch(function(){});
      }).then(function(){ return sleep(1500); });
    });
    return ep;
  });

  // Earnings calendar
  seq = seq.then(function() {
    setP(65, 'Fetching earnings calendar...');
    var from = new Date().toISOString().slice(0,10);
    var to   = new Date(Date.now()+90*24*3600*1000).toISOString().slice(0,10);
    return fhub('/calendar/earnings?from='+from+'&to='+to).then(function(ec) {
      (ec.earningsCalendar||[]).forEach(function(e) {
        if (ALL_HOLDINGS.some(function(h){ return h.t===e.symbol; })) earningsMap[e.symbol]=e.date;
      });
    }).catch(function(){});
  }).then(function(){ return sleep(1500); });

  // News
  seq = seq.then(function() {
    setP(68, 'Fetching news...');
    var valid = qdata.filter(function(q){ return q.pct!=null; });
    valid.sort(function(a,b){ return Math.abs(b.pct||0)-Math.abs(a.pct||0); });
    var newsTks = valid.slice(0,10).map(function(q){ return q.t; });
    var np = Promise.resolve();
    newsTks.forEach(function(tk) {
      np = np.then(function() {
        var today = new Date().toISOString().slice(0,10);
        var yest  = new Date(Date.now()-2*86400000).toISOString().slice(0,10);
        return fhub('/company-news?symbol='+tk+'&from='+yest+'&to='+today).then(function(n) {
          if (n&&n.length>0) newsDigest.push({t:tk,hl:san(n[0].headline),src:san(n[0].source)});
        }).catch(function(){});
      }).then(function(){ return sleep(1500); });
    });
    return np;
  });

  // Analyst
  seq = seq.then(function() {
    setP(76, 'Fetching analyst ratings...');
    var aTks = Object.keys(techMap).filter(function(t){ return t!=='SPY'; }).slice(0,8);
    var ap = Promise.resolve();
    aTks.forEach(function(tk) {
      ap = ap.then(function() {
        return fhub('/stock/recommendation?symbol='+tk).then(function(r) {
          if (r&&r.length>0) analystMap[tk]={buy:r[0].strongBuy+r[0].buy,hold:r[0].hold,sell:r[0].sell+r[0].strongSell};
        }).catch(function(){});
      }).then(function(){ return sleep(1500); });
    });
    return ap;
  });

  // Watchlist quotes
  seq = seq.then(function() {
    setP(82, 'Fetching watchlist...');
    var wlData = [];
    var wlTks  = loadWL();
    var wp = Promise.resolve();
    wlTks.forEach(function(tk) {
      var wd = {t:tk, price:null, pct:null, hi52:null, lo52:null, target:null};
      wp = wp.then(function() {
        return fhub('/quote?symbol='+tk).then(function(q) {
          wd.price=q.c||null; wd.pct=q.dp||null;
        }).catch(function(){});
      }).then(function(){ return sleep(1500); })
      .then(function() {
        return fhub('/stock/metric?symbol='+tk+'&metric=all').then(function(r) {
          var m=r.metric||{}; wd.hi52=m['52WeekHigh']||null; wd.lo52=m['52WeekLow']||null;
        }).catch(function(){});
      }).then(function(){ return sleep(1500); })
      .then(function() {
        return fhub('/stock/price-target?symbol='+tk).then(function(r) {
          if (r&&r.targetMean) wd.target=r.targetMean;
        }).catch(function(){});
      }).then(function() { wlData.push(wd); return sleep(1500); });
    });
    return wp.then(function(){ return wlData; });
  });

  seq.then(function(wlData) {
    if (!Array.isArray(wlData)) wlData = [];
    renderAndStream(qdata, fails, rangeMap, targetMap, techMap, epsMap, newsDigest, analystMap, earningsMap, wlData);
  }).catch(function(e) {
    document.getElementById('progress').style.display = 'none';
    document.getElementById('report').style.display = 'block';
    document.getElementById('report').innerHTML = '<div class="warn">Error: '+san(e.message)+'</div>';
  });
}

function renderAndStream(qdata, fails, rangeMap, targetMap, techMap, epsMap, newsDigest, analystMap, earningsMap, wlData) {
  setP(90, 'Rendering report...');

  var valid = qdata.filter(function(q){ return q.pct!=null&&q.th!=='Benchmark'; });
  var sorted = valid.slice().sort(function(a,b){ return b.pct-a.pct; });
  var avgPct = valid.length ? valid.reduce(function(s,q){ return s+q.pct; },0)/valid.length : 0;
  var gainCount = valid.filter(function(q){ return q.pct>0; }).length;
  var lossCount = valid.filter(function(q){ return q.pct<0; }).length;
  var spy = qdata.filter(function(q){ return q.t==='SPY'; })[0];
  var qqq = qdata.filter(function(q){ return q.t==='QQQ'; })[0];

  // Portfolio weights
  var sh = loadShares();
  var totalVal = 0;
  var weightMap = {};
  valid.forEach(function(q) {
    var shares = sh[q.t]||0, val = shares*(q.price||0);
    weightMap[q.t] = {shares:shares, val:val, pct:0};
    totalVal += val;
  });
  if (totalVal > 0) {
    Object.keys(weightMap).forEach(function(t){ weightMap[t].pct = weightMap[t].val/totalVal*100; });
  }

  // Sector performance
  var spm = {};
  valid.forEach(function(q) {
    if (!spm[q.th]) spm[q.th]={sum:0,cnt:0};
    spm[q.th].sum+=q.pct; spm[q.th].cnt++;
  });
  var sectors = Object.keys(spm).map(function(n){ return {n:n,avg:spm[n].sum/spm[n].cnt}; })
    .sort(function(a,b){ return b.avg-a.avg; });

  // Alerts
  var alerts = [];
  valid.forEach(function(q) {
    var r=rangeMap[q.t]||{}, pt=targetMap[q.t];
    if (Math.abs(q.pct)>=3) alerts.push({t:q.t,pct:q.pct,reason:(q.pct>=0?'+':'')+q.pct.toFixed(1)+'% daily move'});
    else if (r.hi52&&q.price&&(r.hi52-q.price)/r.hi52*100<=5) alerts.push({t:q.t,pct:q.pct,reason:'Within 5% of 52w high ($'+r.hi52.toFixed(2)+')'});
    else if (r.lo52&&q.price&&(q.price-r.lo52)/r.lo52*100<=5) alerts.push({t:q.t,pct:q.pct,reason:'Within 5% of 52w low ($'+r.lo52.toFixed(2)+')'});
    if (pt&&q.price&&(pt.mean-q.price)/q.price*100<=3) alerts.push({t:q.t,pct:q.pct,reason:'Near analyst target ($'+pt.mean.toFixed(0)+')'});
  });

  // Build prompt strings
  var topPositions = Object.keys(weightMap).filter(function(t){ return weightMap[t].pct>0; })
    .sort(function(a,b){ return weightMap[b].pct-weightMap[a].pct; }).slice(0,10)
    .map(function(t){ return t+' '+weightMap[t].pct.toFixed(1)+'%'; }).join(', ');

  var holdStr = valid.map(function(q) {
    var w=weightMap[q.t], pt=targetMap[q.t], tm=techMap[q.t];
    var s=sh[q.t]||0, v=s*(q.price||0);
    return q.t+'('+san(q.th)+'): $'+(q.price||0).toFixed(2)+' '+(q.pct>=0?'+':'')+q.pct.toFixed(2)+'%'
      +(s>0?' '+s+'sh($'+v.toLocaleString('en-US',{maximumFractionDigits:0})+')':'')
      +(w&&w.pct>0?' wt:'+w.pct.toFixed(1)+'%':'')
      +(pt?' tgt:$'+pt.mean.toFixed(0):'')
      +(tm?' RSI:'+tm.rsi.toFixed(0)+' '+tm.sig+' '+tm.trend:'');
  }).join('\n');

  var techStr = Object.keys(techMap).filter(function(t){ return t!=='SPY'; }).map(function(t) {
    var v=techMap[t];
    var p=['['+v.sig+'] '+v.trend];
    if (v.rsi!=null) p.push('RSI:'+v.rsi.toFixed(0));
    if (v.sma20&&v.sma50) p.push('SMA20:$'+v.sma20.toFixed(2)+' SMA50:$'+v.sma50.toFixed(2));
    if (v.macd&&v.macd.hist!=null) p.push('MACD hist:'+(v.macd.hist>=0?'+':'')+v.macd.hist.toFixed(2));
    if (v.boll) p.push('Boll:'+v.boll.pct.toFixed(0)+'%'+(v.boll.pct>80?' EXTENDED':v.boll.pct<20?' OVERSOLD':''));
    if (v.atr) p.push('ATR:$'+v.atr.toFixed(2));
    if (v.vr) p.push('Vol:'+(v.vr>=0?'+':'')+v.vr.toFixed(1)+'x');
    if (v.a30!=null) p.push('RS30:'+(v.a30>=0?'+':'')+v.a30.toFixed(1)+'%vsSPY');
    if (v.a90!=null) p.push('RS90:'+(v.a90>=0?'+':'')+v.a90.toFixed(1)+'%vsSPY');
    return t+': '+p.join(', ');
  }).join('\n') || 'Candle data unavailable this run';

  var epsStr = Object.keys(epsMap).map(function(t) {
    var e=epsMap[t];
    return t+': actual $'+(e.actual||0).toFixed(2)+' vs est $'+(e.est||0).toFixed(2)+' ('+(e.surpPct>=0?'+':'')+e.surpPct.toFixed(1)+'%) '+e.date;
  }).join('\n') || 'none';

  var newsStr = newsDigest.map(function(n){ return n.t+': '+n.hl; }).join('\n') || 'none';
  var earnStr = Object.keys(earningsMap).map(function(t){ return t+':'+earningsMap[t]; }).join(', ') || 'none';
  var alertStr = alerts.length ? alerts.map(function(a){ return a.t+': '+a.reason; }).join('\n') : 'none';
  var analStr = Object.keys(analystMap).map(function(t) {
    var v=analystMap[t], pt=targetMap[t];
    return t+': '+v.buy+'B/'+v.hold+'H/'+v.sell+'S'+(pt?' tgt:$'+pt.mean.toFixed(0):'');
  }).join('\n') || 'none';
  var wlStr = wlData.filter(function(w){ return w.price!=null; }).map(function(w) {
    var up=w.target&&w.price?(w.target-w.price)/w.price*100:null;
    return 'WATCH '+w.t+': $'+(w.price||0).toFixed(2)+' '+(w.pct>=0?'+':'')+w.pct.toFixed(2)+'%'+(up!=null?' upside:'+(up>=0?'+':'')+up.toFixed(1)+'%':'')+(w.target?' tgt:$'+w.target.toFixed(0):'');
  }).join('\n') || 'none';

  // Render
  document.getElementById('progress').style.display = 'none';
  var ra = document.getElementById('report');
  ra.style.display = 'block';

  var today = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  var totalFmt = totalVal>0 ? '$'+totalVal.toLocaleString('en-US',{maximumFractionDigits:0}) : 'Enter shares to calculate';

  // Scorecard
  var scoreHTML = '<div class="scorecard">'
    +'<div class="sc"><div class="sc-label">Portfolio Avg</div><div class="sc-val '+(avgPct>=0?'up':'dn')+'">'+(avgPct>=0?'+':'')+avgPct.toFixed(2)+'%</div><div class="sc-sub">'+gainCount+' up / '+lossCount+' dn</div></div>'
    +'<div class="sc"><div class="sc-label">Portfolio Value</div><div class="sc-val" style="font-size:1rem;">'+totalFmt+'</div><div class="sc-sub">From shares entered</div></div>'
    +'<div class="sc"><div class="sc-label">SPY</div><div class="sc-val">'+fmtPct(spy?spy.pct:null)+'</div><div class="sc-sub">Benchmark</div></div>'
    +'<div class="sc"><div class="sc-label">QQQ</div><div class="sc-val">'+fmtPct(qqq?qqq.pct:null)+'</div><div class="sc-sub">Benchmark</div></div>'
    +'<div class="sc"><div class="sc-label">Top Mover</div><div class="sc-val" style="font-size:1rem;">'+(sorted[0]?sorted[0].t:'--')+'</div><div class="sc-sub">'+(sorted[0]?fmtPct(sorted[0].pct):'--')+'</div></div>'
    +'<div class="sc"><div class="sc-label">Alerts</div><div class="sc-val" style="color:'+(alerts.length?'var(--yellow)':'var(--green)')+'">'+alerts.length+'</div><div class="sc-sub">'+(alerts.length?'Flags raised':'All clear')+'</div></div>'
    +'</div>';

  // Alert bars
  var alertHTML = '';
  if (alerts.length) {
    alertHTML = '<div class="section" style="border-color:rgba(233,69,96,0.3);"><h3>Alert Flags</h3>';
    alerts.forEach(function(a) {
      alertHTML += '<div class="alert-bar"><span class="ab-tk">'+a.t+'</span><span class="ab-r">'+a.reason+'</span><span class="ab-p '+(a.pct>=0?'up':'dn')+'">'+(a.pct>=0?'+':'')+a.pct.toFixed(2)+'%</span></div>';
    });
    alertHTML += '</div>';
  }

  // Warn
  var warnHTML = fails.length ? '<div class="warn">Network issues: '+fails.join(', ')+'</div>' : '';

  // Sector perf
  var maxS = 0.01; sectors.forEach(function(s){ if(Math.abs(s.avg)>maxS) maxS=Math.abs(s.avg); });
  var secHTML = '<div class="section"><h3>Sector Performance</h3>';
  sectors.filter(function(s){ return s.n!=='Benchmark'&&s.n!=='ETF'; }).forEach(function(s) {
    secHTML += '<div class="srow"><span class="slabel">'+s.n+'</span>'
      +'<div class="sbar-wrap"><div class="sbar-fill" style="width:'+Math.abs(s.avg)/maxS*100+'%;background:'+(s.avg>=0?'var(--green)':'var(--red)')+'"></div></div>'
      +'<span class="spct '+(s.avg>=0?'up':'dn')+'">'+(s.avg>=0?'+':'')+s.avg.toFixed(2)+'%</span></div>';
  });
  secHTML += '</div>';

  // Weight concentration
  var maxW = 0.01;
  Object.keys(weightMap).forEach(function(t){ if(weightMap[t].pct>maxW) maxW=weightMap[t].pct; });
  var wtHTML = '';
  if (totalVal > 0) {
    var wtItems = Object.keys(weightMap).filter(function(t){ return weightMap[t].pct>0; })
      .sort(function(a,b){ return weightMap[b].pct-weightMap[a].pct; });
    wtHTML = '<div class="section"><h3>Portfolio Concentration</h3>';
    // by sector
    var sectorW = {};
    valid.forEach(function(q) {
      if (!sectorW[q.th]) sectorW[q.th]=0;
      sectorW[q.th] += weightMap[q.t]?weightMap[q.t].pct:0;
    });
    var sWItems = Object.keys(sectorW).filter(function(k){ return sectorW[k]>0; })
      .sort(function(a,b){ return sectorW[b]-sectorW[a]; });
    var mxW2 = 0.01; sWItems.forEach(function(k){ if(sectorW[k]>mxW2) mxW2=sectorW[k]; });
    sWItems.forEach(function(k) {
      var over = sectorW[k]>25, flag = over?' (!)overweight':'';
      wtHTML += '<div class="srow"><span class="slabel">'+k+'</span>'
        +'<div class="sbar-wrap"><div class="sbar-fill" style="width:'+sectorW[k]/mxW2*100+'%;background:'+(over?'var(--yellow)':'var(--green)')+'"></div></div>'
        +'<span class="spct" style="color:'+(over?'var(--yellow)':'var(--white)')+'">'+sectorW[k].toFixed(1)+'%'+flag+'</span></div>';
    });
    wtHTML += '</div>';
  }

  // Technical table
  var techHTML = '';
  var techKeys = Object.keys(techMap).filter(function(t){ return t!=='SPY'; });
  if (techKeys.length) {
    techHTML = '<div class="section"><h3>Technical Analysis - Top '+techKeys.length+' Holdings</h3><div style="overflow-x:auto;"><table class="htable"><thead><tr>'
      +'<th>Ticker</th><th class="r">Price</th><th class="r">Trend</th><th class="r">SMA20</th><th class="r">SMA50</th>'
      +'<th class="r">RSI</th><th class="r hm">MACD</th><th class="r hm">Boll%</th><th class="r hm">RS30</th><th class="r hm">RS90</th><th class="r">Signal</th>'
      +'</tr></thead><tbody>';
document.addEventListener('DOMContentLoaded', function() {
  var s=document.getElementById('status');
  s.textContent='Test F-runRest OK - lines 14-700';
  s.style.background='#006600';
  document.getElementById('btn').addEventListener('click',function(){ s.textContent='BUTTON WORKS!'; });
});
})();
</script></body></html>
